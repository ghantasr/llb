<style>
  :root {
    --paper: #f4efe6; --ink: #1d1914; --muted: #5c5348; --faint: #8a7d6c;
    --line: #e3d8c6; --card: #fffdf8; --red: #8d2c2c; --green: #1d6a43;
    --greenbg: #e5f3ea; --gold: #8a5a12; --goldbg: #f8efd8;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Source Serif 4", Palatino, Georgia, serif;
    font-size: 21px; line-height: 1.62;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .page { width: min(820px, calc(100% - 40px)); margin: 0 auto; padding: 22px 0 80px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 18px; }
  .topbar button, .linkish {
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 16px;
  }
  .kicker { letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: var(--gold); font-weight: 600; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 40px; line-height: 1.15; margin: 6px 0 10px; font-weight: 560; }
  h2 { font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 1.2; margin: 0 0 8px; font-weight: 560; }
  .lede { color: var(--muted); font-size: 19px; margin: 0 0 18px; }
  .papers { display: grid; gap: 12px; }
  .paper-btn, .unit-btn {
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 16px 16px 14px; width: 100%;
  }
  .paper-btn b, .unit-btn b { display: block; font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 560; }
  .paper-btn span, .unit-btn span { display: block; color: var(--muted); font-size: 17px; margin-top: 4px; }
  .paper-btn.go, .unit-btn.go { border-color: #c9a3a3; box-shadow: inset 4px 0 0 var(--red); }
  .done { color: var(--green); font-size: 15px; }
  .flow { display: flex; flex-direction: column; gap: 0; margin: 8px 0 18px; }
  .node {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .node b { display: block; font-size: 20px; }
  .node span { display: block; color: var(--muted); font-size: 17px; }
  .arrow { text-align: center; color: var(--red); font-size: 20px; line-height: 1; padding: 4px 0; }
  .arrow::before { content: "↓"; }
  .chart { display: flex; flex-direction: column; align-items: center; gap: 0; margin: 8px 0 18px; }
  .chart .node {
    width: min(100%, 640px); text-align: left; background: var(--card);
    border: 2px solid var(--ink); border-radius: 14px; padding: 12px 14px;
  }
  .chart button.node { font: inherit; color: inherit; cursor: pointer; }
  .chart .node b { display: block; font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .chart .node span { display: block; color: var(--muted); font-size: 16px; margin-top: 2px; }
  .chart .node.go { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
  .chart-arrow { width: min(100%, 640px); text-align: center; color: var(--gold); font-size: 16px; padding: 8px 8px 6px; }
  .chart-arrow::before { content: "↓"; display: block; font-size: 22px; line-height: 1; }
  .chart-title { width: min(100%, 860px); margin: 8px 0 4px; font-family: Fraunces, Georgia, serif; font-size: 20px; }
  .branch { display: grid; gap: 8px; margin-top: 8px; }
  .chart .branch { width: min(100%, 860px); margin-top: 0; }
  .chart .branch .node { width: 100%; }
  table.align td.law { color: var(--red); font-weight: 600; }
  table.align tr.here { outline: 2px solid var(--gold); }
  a.quiet { color: var(--red); }
  @media (min-width: 720px) {
    .branch.cols-2 { grid-template-columns: 1fr 1fr; }
    .branch.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  }
  .grouplabel { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); margin: 16px 0 6px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 12px 0; }
  .box.gold { background: var(--goldbg); }
  .box h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin: 10px 0; }
  .card .term { font-family: Fraunces, Georgia, serif; font-size: 22px; }
  .card .means { margin: 6px 0; }
  .card button.reveal, button.know {
    background: var(--goldbg); border: 1px solid #e3d3a4; border-radius: 999px;
    padding: 4px 12px; font-size: 16px;
  }
  .example { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--muted); }
  .example.show { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 17px; background: var(--card); }
  th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--goldbg); font-weight: 600; }
  .actwords {
    margin: 8px 0; padding: 8px 0 8px 12px;
    border-left: 3px solid var(--gold); color: var(--ink); font-size: 18px;
  }
  .drill-bit { margin: 6px 0; }
  .q { margin: 14px 0; }
  .opts { display: grid; gap: 8px; }
  .opts button { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .opts button.right { background: var(--greenbg); border-color: var(--green); }
  .opts button.wrong { background: #f8e6e2; border-color: var(--red); }
  .why { font-size: 17px; color: var(--muted); margin-top: 8px; }
  ul.cites { margin: 8px 0 0; padding-left: 1.2em; font-size: 17px; }
  ul.cites li { margin: 6px 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 16px; }
  .tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 18px; }
  .shell { display: flex; align-items: stretch; width: 100%; min-height: 100vh; background: var(--paper); }
  .side {
    position: sticky; top: 0; align-self: flex-start;
    height: 100vh; overflow: auto;
    flex: 0 0 248px; width: 248px; max-width: 248px;
    background: #ebe4d6; border-right: 1px solid var(--line);
    padding: 16px 10px 28px;
  }
  .side .kicker { display: block; margin: 0 8px 8px; }
  .side button { font-size: 15px; line-height: 1.3; }
  .nav-paper, .nav-unit {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 0; border-radius: 8px;
  }
  .nav-paper {
    font-family: Fraunces, Georgia, serif; font-size: 16px; font-weight: 560;
    padding: 8px 8px; margin-top: 4px;
  }
  .nav-paper.here { box-shadow: inset 3px 0 0 var(--red); background: var(--card); }
  .nav-unit {
    font-size: 14px; line-height: 1.3; color: var(--muted);
    padding: 4px 8px 4px 18px;
  }
  .nav-unit.on { background: var(--goldbg); color: var(--ink); }
  .nav-unit .tick { color: var(--green); }
  .main { flex: 1 1 auto; min-width: 0; background: var(--paper); }
  .nav-backdrop { display: none; }
  #navtoggle { display: none; }
  @media (max-width: 760px) {
    .side {
      position: fixed; z-index: 20; left: 0; top: 0;
      width: min(280px, 86vw); max-width: none; flex: none;
      transform: translateX(-105%);
      transition: transform .18s ease;
    }
    .shell.nav-open .side { transform: none; box-shadow: 8px 0 28px rgba(29, 25, 20, .18); }
    .shell.nav-open .nav-backdrop {
      display: block; position: fixed; inset: 0; z-index: 15;
      background: rgba(29, 25, 20, .35); border: 0; padding: 0;
    }
    #navtoggle { display: inline-block; }
  }
</style>

      n: "Unit 1",
      title: "Why the law keeps some promises",

      idea: "A contract is a promise the law will enforce. A social promise is real to your friends, and still not a contract.",
      analogy: "Think of two notebooks. One is a dinner plan with a friend. The other is a tailor’s slip: cloth chosen, price written, delivery date fixed. Only the second notebook is the law’s business, because each side gave something for the other’s promise.",
      story: "In old English courts you could not simply say he broke his word. You had to fit your complaint into a named form, called a writ. Over time the courts stretched those forms until a serious bargain could be enforced. Indian contract law inherited that bargain idea and wrote it into the Indian Contract Act, 1872.",
      steps: [

        ["Assumpsit", "Latin for he undertook. The courts began to enforce a promise because the person had assumed it."],
        ["Consideration", "The price of the promise. Each side must give, do, or promise something."],

      cards: [
        ["Moral basis", "People rely on promises and arrange money, travel, and work around them. The moral pull is: do not disappoint someone who trusted you. The legal pull is narrower. The law enforces the promise only when it is a bargain the Act recognises.", "You promise a cousin a birthday gift. He feels let down if you forget. He still cannot sue. You promise a hall for a wedding and take an advance. That reliance is the law’s concern."],

        ["Objective theory", "This theory asks what a reasonable person would understand from the words and conduct. Indian law, like modern common law, uses this. A private joke does not save you if you looked serious.", "You say I accept with a straight face, then later claim it was a joke. The other person, acting reasonably, can treat it as acceptance."],

        { q: "Which theory does Indian contract law follow when words and secret intention differ?", options: ["Only the secret intention", "What a reasonable person would understand from the words and conduct", "Whatever the judge personally prefers"], a: 1, why: "The objective theory looks at outward words and conduct." }

      story: "Riya and her hostel mate agree to revise together every night. That is an agreement of routine. The same week Riya agrees to pay a photocopy shop a fixed rate for binding her notes. The second one has a price, a lawful object, and parties who can contract. That is the contract.",

        ["Necessaries, section 68", "If a person incapable of contracting is supplied with necessaries suited to his condition in life, the supplier is reimbursed from the incapable person’s property. There is no personal liability. Necessaries are not only food. They include what is reasonably required for that person’s station, such as teaching, or a coat if he has none.", "Books and college fees supplied to a minor who has property can be claimed from that property. The minor is not personally decreed to pay from future wages."],

        ["Coercion, the essentials", "The threat or act must be forbidden by the Penal Code, or must be unlawful detention of property. It may be aimed at any person, not only the contracting party. It may be done by any person, not only the other party. The place does not matter: the explanation says it is immaterial whether the Penal Code is in force in the place of the coercion.", "A husband threatens to shoot his wife unless she signs a gift of her land to his brother. The brother’s contract is voidable, though the brother did not hold the weapon."],
        ["Duress and economic duress", "Duress is the English word for pressure, classically violence or threat of violence to the person. Section 15 is wider, because it includes any act forbidden by the Penal Code and unlawful detention of property. Economic duress means overwhelming commercial pressure that leaves no real choice. It is not a separate Indian section. If you argue it, you still begin from free consent and section 15, and you show that the pressure went beyond hard bargaining.", "A supplier says accept double the price today or I will sink your only shipment, which I am already bound to deliver. Hard bargaining is lawful. A threat to break a duty in a way that chokes all choice is the argument for economic duress."],
        ["Effect of coercion, and section 72", "The contract is voidable at the option of the person whose consent was caused by it. Money paid under coercion can also be recovered as a quasi-contract under section 72.", "You pay a sum because your goods are unlawfully locked in a warehouse until you sign. You may avoid the agreement and claim the money back."],

        ["Unconscionable bargains", "A bargain that shocks the conscience, between parties of very unequal bargaining power, invites the section 16 enquiry. A low price alone, between two shopkeepers of equal skill, is not undue influence.", "A high rate of interest charged to a person in acute distress, by the only lender who also advises him, is the pattern. A high rate between two traders is a different case."],
        ["Misrepresentation of fact and of law", "Section 18 covers a positive assertion not warranted by the information of the person making it, a breach of duty without intent to deceive, and causing a mistake about the subject matter innocently. A misstatement of the law of India is generally not a ground, in the same spirit as section 21. A misstatement of foreign law is treated as a misstatement of fact. A misstatement about a private right, such as the extent of a title, is treated as fact.", "The seller innocently says the plot is 200 square metres because an old brochure said so, and it is 150. That can be misrepresentation. Saying the Indian Stamp Act requires a particular duty, when both could read the Act, is a weak ground."],
        ["Fraud, suggestio falsi and suppressio veri", "Suggestio falsi: stating as a fact what is not true, and what the maker does not believe to be true. Suppressio veri: active concealment, not mere silence. A promise made without any intention of performing it is also fraud under section 17. Intention is the line between fraud and misrepresentation.", "Painting over cracks in a beam before the buyer’s visit is active concealment. Simply not volunteering that the area is noisy, when you were not asked and there is no duty to speak, is usually silence, not fraud."],

        ["Forbidden by law", "What a statute prohibits cannot be the object of a contract. What a statute only regulates, such as a licence, needs a careful reading: sometimes the contract is void, sometimes only a penalty is imposed and the contract stands.", "An agreement to sell liquor in a State where that sale is prohibited is forbidden by law."],
        ["Agreements without consideration, section 25", "Void, with three exceptions. One: a written and registered promise, made out of natural love and affection, between parties standing in a near relation. Two: a promise to compensate, wholly or in part, a person who has already voluntarily done something for the promisor. Three: a written promise, signed by the debtor or his agent, to pay a debt barred by limitation.", "A father, in a registered writing, promises out of natural love to give his daughter a house. That can fall under section 25(1)."],
        ["Restraint of marriage, section 26", "Every agreement in restraint of the marriage of any person, other than a minor, is void. The law will not let a private deal take away the freedom to marry.", "A promise to pay a cousin Rs 2 lakh if she never marries is void."],
        ["Restraint of trade, section 27", "Every agreement by which anyone is restrained from exercising a lawful profession, trade or business of any kind, is void to that extent. The only exception written in the section is the sale of goodwill: the seller may agree not to carry on a similar business within specified local limits, so long as the buyer carries on the business, and the limits are reasonable.", "A contract that says a software employee can never work in the entire software industry, anywhere in India, for ten years after leaving, is void under section 27."],
        ["Other restraints the law allows", "They are not written as exceptions inside section 27, but other Acts and court decisions save reasonable restraints. Section 11 of the Partnership Act: partners may agree not to carry on any business other than that of the firm while they are partners. Section 36: an outgoing partner may agree not to carry on a similar business within a specified period or local limits. Section 54: partners may agree a similar restraint upon dissolution. A reasonable exclusive-dealing agreement, and a restraint on an employee during the term of service, can stand. A post-service restraint that is wider than protecting a real secret or goodwill usually falls.", "A partner who retires agrees not to open a similar shop within two kilometres for two years. If those limits are reasonable, the Partnership Act can save the clause."],
        ["Restraint of legal proceedings, section 28", "An agreement that absolutely stops a person from enforcing his rights by the usual legal proceedings, or that limits the time within which he may enforce them to a period shorter than the Limitation Act, is void. Two savings: a contract to refer disputes to arbitration, and a contract to refer a dispute that has already arisen to arbitration.", "A clause saying you must sue within 15 days, when the Limitation Act gives three years, is void. A clause referring disputes to arbitration is not."],
        ["Uncertain agreements, section 29", "Agreements the meaning of which is not certain, or capable of being made certain, are void. Courts will not write the price the parties never fixed, unless the contract itself gives a way to fix it.", "I will sell you a tonne of oil, with no kind, no quality, and no way to identify which oil, is void. I will sell you my rice at the Madras harbour rate on the date of delivery can be made certain."],
        ["Wagering agreements, section 30", "A wager is a promise to pay money on the happening of an uncertain event, where each side can win or lose, and neither side has any other interest in the event. Such agreements are void. The section’s own exception is a subscription or contribution for a plate, prize or sum of money of five hundred rupees or more, to the winner of a horse race. A game of skill is not a wager. Insurance is not a wager if the insured has an insurable interest.", "Two students bet Rs 1,000 on a cricket match, neither owning a team. Neither can sue the other. A fire policy on your own house is not a wager, because you lose if the house burns."]

      wider: "Contract law stands between two fears. If every promise were enforced, a court would have to referee friendship and family life. If no promise were enforced, nobody could plan a trade. Early English courts enforced only named forms: a writ of debt for a fixed sum, a covenant for a sealed promise, and later assumpsit, meaning he undertook. Consideration was the price of letting informal promises into court. The Indian Contract Act, 1872 writes that bargain theory for the whole country. It is not a copy of morality. A promise can be morally binding and still not be a contract. The objective theory matters in a large and diverse country: the court tries the words and conduct a reasonable person heard, not a private diary. Sanctity of contract is the other half. Once the Act’s tests are met, a hard bargain is still enforced. The later units are the limits on that freedom: capacity, free consent, and a lawful object.",

    c1u4: {
      wider: "Consideration is the Act’s filter between a gift and a bargain. English law insisted that the price move from the promisee himself. That is privity of consideration, and it is why a stranger failed in Tweddle v. Atkinson and again in Dunlop v. Selfridge. Section 2(d) deliberately says the promisee or any other person. Indian law therefore dropped privity of consideration, in Chinnaya v. Ramayya, and kept privity of contract: a stranger still cannot sue, as M.C. Chacko holds. The Law Commission of India, in its 13th Report of 1958, thought this filter had become too technical, and that a serious promise which someone had relied on deserved a wider remedy. Parliament has not repealed section 25. In an evaluation, hold both truths. The doctrine keeps birthday promises out of court. It can also defeat a person who rearranged his life around a one-sided promise.",

      cites: [

    c1u7: {
      wider: "Section 23 is the point at which contract law serves every other branch of law. The court will not collect the price of a deal Parliament has forbidden, or a deal that buys off a prosecution, blocks a marriage, or takes away the right to earn a living. Gherulal Parakh is the caution: public policy has known heads, and a judge does not invent a new one out of personal dislike. Section 27 is a policy choice in favour of the freedom to work. English law will save a restraint if it is reasonable. The Indian section starts from void, and saves only the goodwill exception inside the section, plus restraints that another Act, such as the Partnership Act, expressly allows, and restraints that operate only while a service or a deal is actually running. Wagers show the difference between void and illegal. Under the unamended Act a wager is void, so the court will not enforce it, but a side agreement is not automatically contaminated. In Maharashtra and Gujarat a local amendment has treated wagers as illegal. If the question is about a collateral transaction, that local difference is the answer.",
      cites: [

        "Niranjan Shankar Golikari v. Century Spinning and Manufacturing Co. (1967) — a restraint during the period of service can be enforced.",
        "Superintendence Company of India v. Krishan Murgai (1980) — a blanket restraint after service ends is void.",
        "Gujarat Bottling Co. Ltd. v. Coca Cola Co. (1995) — a restriction that operates while the positive covenant is in force can be reasonable and valid.",
        "The old Bombay Act amendment, still relevant in Maharashtra and Gujarat, under which wagering agreements are not merely void but illegal."

    c1u8: {
      wider: "Discharge tells you which story the facts belong to. Breach is a wrong: one side would not do what he still could do. Frustration is nobody’s fault. The act has become impossible or unlawful, or the common purpose has been destroyed. Satyabrata Ghose is the Indian reading of section 56. It does not depend on inventing an implied term, which was the older English way of explaining Taylor v. Caldwell. A contract that has only become expensive is not frustrated. Alopi Parshad says that in terms. A completed lease is a transfer of an interest in land, not a promise still waiting to be performed, so Raja Dhruv Dev Chand holds that section 56 does not dissolve it as if it were an ordinary executory contract. Section 63 is a conscious departure from English law. The promisee may accept less, or give more time, without fresh consideration. English law needed a new bargain, or a deed, for that concession.",
      cites: [
        "Indian Contract Act, 1872, sections 37, 38, 39, 51 to 56, 62, 63 and 65.",
        "Satyabrata Ghose v. Mugneeram Bangur and Co. (1954) — later impossibility or a fundamental change of circumstances under section 56.",
        "Alopi Parshad and Sons Ltd. v. Union of India (1960) — unexpected hardship or a rise in cost is not frustration.",
        "Raja Dhruv Dev Chand v. Raja Harmohinder Singh (1968) — section 56 does not apply to a completed lease in the same way.",
        "Taylor v. Caldwell (1863) — destruction of the music hall excused the contract. This is the English root, not the Indian test.",

    c1u9: {
      wider: "Quasi-contract is the Act admitting that agreement is not the only reason one person should pay another. The common thread is unjust enrichment: keep the benefit only if keeping it is just. Lord Mansfield’s judgment in Moses v. Macferlan is the ancestor of that idea, long before sections 68 to 72. Section 70 is the widest section, and the one governments and contractors most often misuse. State of West Bengal v. B.K. Mondal reads it strictly. The act must be lawful, it must not have been meant as a gift, and the other side must have enjoyed the benefit. The section cannot be used to ignore the rules about how a government contract is made, but if the State has in fact taken the benefit, compensation can still be due. Section 72 is wider than the old English rule. Sales Tax Officer v. Kanhaiya Lal holds that money paid under a mistake of law, not only a mistake of fact, can be recovered.",
      cites: [
        "Indian Contract Act, 1872, sections 68, 69, 70, 71 and 72.",
        "State of West Bengal v. B.K. Mondal and Sons (1962) — the three conditions of section 70.",
        "Sales Tax Officer, Banaras v. Kanhaiya Lal Mukundlal Saraf (1959) — money paid under a mistake of law is recoverable under section 72.",
        "Moses v. Macferlan (1760) — Lord Mansfield on money had and received, the older unjust-enrichment idea."

    c1u10: {
      wider: "Damages for breach aim to put the injured party, so far as money can, where he would have been if the contract had been performed. They are not a fine. That single policy explains section 73 and section 74. The loss must have been in the contemplation of the parties, which is Hadley v. Baxendale written into section 73, and the injured party must mitigate. If the contract names a sum, section 74 does not hand that sum over automatically. Fateh Chand says the court awards reasonable compensation and treats the named figure as the ceiling, whether the contract calls it a penalty or liquidated damages. Maula Bux adds that loss which can be proved should be proved. ONGC v. Saw Pipes allowed a genuine pre-estimate where the loss was real and hard to quantify. Kailash Nath Associates pulled the law back: Saw Pipes is not a licence to collect the written figure when there was no loss and the loss was not difficult to prove. Specific performance is the other remedy. After the 2018 amendment it is the ordinary decree for contracts that qualify, which is Unit 11.",
      cites: [
        "Indian Contract Act, 1872, sections 73, 74 and 75.",
        "Hadley v. Baxendale (1854) — ordinary loss, and special loss within the contemplation of both parties.",
        "Murlidhar Chiranjilal v. Harishchandra Dwarkadas (1962) — market-price measure, and mitigation.",
        "Fateh Chand v. Balkishan Das (1963) — section 74 awards reasonable compensation, not the penalty as a matter of course.",
        "Maula Bux v. Union of India (1970) — prove the loss where it is capable of proof.",
        "ONGC Ltd. v. Saw Pipes Ltd. (2003) — a genuine pre-estimate can be reasonable compensation where exact proof is difficult.",
        "Kailash Nath Associates v. Delhi Development Authority (2015) — the named sum is not automatic. No loss, where loss could have been proved, can mean no compensation under the clause."

    c1u11: {
      wider: "Specific relief comes from equity. The court orders the very act when money is a poor substitute, and it refuses that order when it would have to supervise a personal relationship day after day, or when the plaintiff himself was never ready to perform. For a long time Indian courts treated specific performance as exceptional. The Specific Relief (Amendment) Act, 2018 changed the default. Section 10 now says the court shall enforce specific performance, subject to the bars in sections 11(2), 14 and 16. The policy is that damages had become a price for breaking a promise about land or a unique thing. Substituted performance, the new section 20, is the practical third path: after at least thirty days’ notice, get the work done by someone else and recover the extra cost. Once that path is taken, specific performance is closed. Section 34 is deliberately narrow. A person who can ask for possession should not be allowed to leave with a paper declaration only. Your printed syllabus says Specific Relief Act, 1969. Cite the Act of 1963.",
      cites: [
        "Specific Relief Act, 1963, sections 5 and 6 (possession), 10, 14 and 16 (specific performance), 20 (substituted performance), 26 (rectification), 27 (rescission), 31 (cancellation), 34 (declaration), 36 to 42 (injunctions).",

      wider: "These two contracts exist because trade needs someone to stand behind a risk. Insurance is a specialised, regulated form of indemnity: one person promises to save another from a defined loss. A bank guarantee is the modern, very strict form of the three-party idea, and courts often treat an unconditional bank guarantee as payable on demand, which is a step beyond the ordinary surety in sections 126 to 147. Equity has always favoured the ordinary surety. Any material change in the debt, made without his consent, discharges him, because his risk is no longer the risk he agreed to run. Indian definition of indemnity in section 124 is narrower than the English one. The English indemnity covers loss from any cause, including accident. Section 124 covers loss caused by the conduct of the promisor himself or of any other person. Gajanan Moreshwar then reads the indemnity-holder’s rights more generously than a bare reading of section 125: he need not always pay the third person first, if his liability has already become absolute.",

      cards: [
        ["Rights in section 125 are not the whole story", "Section 125 lists what the indemnity-holder may recover from the indemnifier in a suit: damages, costs, and compromise sums. Gajanan Moreshwar holds that he can also compel the indemnifier to place him in funds once the liability is absolute, instead of waiting until he has paid and been ruined.", "A promoter who was promised an indemnity against a property claim can ask the indemnifier to meet that claim once the liability is no longer uncertain."],
        ["Consideration for a guarantee, section 127", "Anything done, or any promise made, for the benefit of the principal debtor is sufficient consideration for the surety. The surety personally need not receive a paisa.", "The bank releases the loan to the nephew. That release is the consideration for the aunt’s guarantee."],
        ["Kinds of guarantee", "A specific guarantee covers one debt. A continuing guarantee, section 129, covers a series of transactions until it is revoked. It may be oral or written. A fidelity guarantee covers an employee’s honesty. Past and future debt should be separated: a guarantee for a past debt needs a fresh consideration moving to the debtor.", "A wholesaler guarantees a retailer’s running account up to Rs 2 lakh. That is continuing. Supplying one identified machine is specific."],
        ["The creditor chooses whom to sue", "Bank of Bihar v. Damodar Prasad rejects the argument that the creditor must exhaust the debtor first. Section 128 means the surety’s pocket is as available as the debtor’s, unless the contract itself says the surety is liable only after the debtor’s assets are exhausted.", "A decree against both can be executed against the surety’s salary without waiting to sell the debtor’s house, if the contract has no such limit."],
        ["How a surety is discharged", "Revocation of a continuing guarantee, as to future transactions, by notice (section 130) or by death (section 131). A change in the terms without consent (section 133). Release of the principal debtor (section 134). A binding contract to give the debtor time, or to accept less (section 135). Mere forbearance to sue does not discharge (section 137). Any act or omission of the creditor which impairs the surety’s eventual remedy discharges him (section 139). If the creditor loses or parts with a security, the surety is discharged to that extent (section 141).", "The bank, without asking the surety, extends the repayment date by a fresh contract with the debtor. The surety can say the contract he guaranteed is no longer the same contract."],
        ["Rights of the surety after he pays", "Section 140: he is invested with the rights the creditor had against the debtor. This is subrogation. He steps into the creditor’s shoes. Section 141: he is entitled to every security the creditor held, even if he did not know of it. Section 145: there is an implied promise by the debtor to indemnify him. Sections 146 and 147: co-sureties contribute equally, unless their contract says otherwise, and unequal limits are shared up to each one’s maximum.", "Two sureties guarantee Rs 1 lakh. One pays the whole. He can recover Rs 50,000 from the co-surety, and the whole Rs 1 lakh from the debtor."],

      story: "A jeweller takes a necklace to resize it. Before the work is done his employee locks it in a box that any visitor can open, and it is stolen. Section 151 asks whether the jeweller took the care an ordinary prudent person would take of his own goods of that bulk and value. If he did, section 152 says he is not liable. If he used the necklace at a wedding in the meantime, section 154 makes him liable for the loss even if he was otherwise careful.",
      wider: "Bailment is older than the Contract Act. Roman law and English law both needed a name for possession that is not ownership. The bailee has possession. The bailor usually keeps ownership. That split is why a finder, a repairer, a transporter and a bank holding valuables can all be bailees, and why a thief who has possession can even be treated as a bailor as against a person who takes the goods from him. The standard of care in section 151 is the same for a paid bailee and a gratuitous bailee: the care a prudent man would take of his own similar goods. English law used to demand more of a paid bailee. India codified one standard. Pledge is only one species of bailment. The pawnee’s power of sale, after reasonable notice under section 176, is what a repairer’s lien does not have. A person who is not the owner can sometimes still create a valid pledge, sections 178 and 178A, because commerce has to be able to trust a mercantile agent who is in possession with the owner’s consent. That is an exception to the idea that nobody can give what he does not have.",

        ["Not a bailment", "A hire-purchase or a sale passes a different interest. A mere servant who holds goods for his master often has custody, not the independent possession of a bailee."]
      ],
      cards: [
        ["What must be true", "Movable goods. Delivery, actual or constructive, section 149. A purpose. A duty to return the same goods or dispose of them as directed. Money paid as a price is not bailment of those notes, unless a specific bag or envelope was to be returned as a thing.", "Parking a car and keeping the key can be analysed as who had possession. If the hotel takes the key and moves the car, the hotel is much closer to a bailee than a ground where you simply park and lock the car yourself."],
        ["Kinds", "For the bailor’s sole benefit: I look after your books for free. For the bailee’s sole benefit: you lend me a cycle. For mutual benefit: a paid repair, or goods carried for freight. The section 151 standard of care applies across these. The bailor’s duty to disclose faults is stricter when the bailment is for hire, section 150.", "A free loan of a ladder that the owner knows is cracked requires disclosure. If the owner is being paid for the ladder, the duty is still higher."],
        ["Duties of the bailee", "Take prudent care. Not use the goods outside the conditions. Not mix them so that they cannot be separated, without consent. Return them, and return any increase or profit, section 163. Deliver to the bailor even if a third person claims title, unless that third person’s title is proved better, sections 166 and 167.", "A cow left in your care has a calf. The calf belongs with the return of the cow, section 163."],
        ["Duties of the bailor", "Disclose known faults, section 150. Bear extraordinary expenses of a gratuitous bailment, section 158. Receive the goods back. Indemnify the bailee for loss caused by a defective title, section 164.", "You lend a generator, knowing the wiring is burnt, and you say nothing. Injury to the borrower is your responsibility under section 150."],
        ["Finder, sections 71, 168 and 169", "A finder is a bailee. He must take care and try to find the owner. He may retain the goods until he receives compensation for trouble and expense. He may sue for that reward if a specific reward was offered. He may sell only in the narrow cases in section 169: the owner cannot be found with reasonable diligence, or refuses to pay the lawful charges, and the goods are perishable or the lawful charges amount to two-thirds of their value.", "Finding a phone creates duties. It does not create ownership."],
        ["Pledge by a person who is not the full owner", "Section 178: a mercantile agent in possession with the owner’s consent can make a valid pledge in the ordinary course of business, if the pawnee acts in good faith. Section 178A: a person in possession under a voidable contract, while the contract has not been rescinded, can pledge to a good-faith pawnee. Section 179: a pledgor with a limited interest can pledge only to the extent of that interest.", "A wholesaler’s agent, left in possession of sarees to sell, pledges them to a lender who does not know of any limit. The lender’s pledge can be good against the owner."],
        ["Pawnee’s choice on default, section 176", "He may sue for the debt and keep the goods as collateral, or he may sell after reasonable notice. He does not become the owner by default. If he sells, the surplus belongs to the pawnor, and the deficit is still due. Lallan Prasad holds that if he sues for the debt he must be in a position to return the goods. He cannot sell them off and also take a decree as if they were still available.", "Notice of sale is not a courtesy. Without reasonable notice the sale is wrongful, though the debt itself does not disappear."]

        { q: "A pledge is", options: ["A sale with a right to repurchase", "A bailment of goods as security for a debt or a promise", "A gift of possession"], a: 1, why: "That is section 172. Ownership does not pass. A power of sale arises only on default, and only with reasonable notice." }

    {

      syllabus: "Sections 182 to 238, Indian Contract Act",
      idea: "An agent is a person employed to do an act for another, or to represent another in dealings with third persons. The agent’s authorised act is, in law, the principal’s act.",
      analogy: "You send your brother to the shop with money and clear instructions to buy a particular fan. As against the shopkeeper, your brother’s authorised purchase is your purchase. If he buys a motorcycle instead, that is outside the authority, and the shopkeeper cannot treat you as the buyer unless you later ratify it.",
      story: "A landlord in another city asks a local manager to let a house. The manager lets it at a rent, takes a deposit, and also, without being asked, signs away the landlord’s right to evict for five years. Letting the house is inside ordinary authority. Giving away the right to evict is not a ministerial extra. Sections 211 and 227 decide which part of that afternoon binds the landlord.",
      wider: "Agency is the device by which a person who cannot be in two places still acts in both. Companies, governments and absent owners would be unable to contract without it. The striking rule is section 185: unlike almost every other contract in Paper I, an agency needs no consideration. The principal’s authority is the point, not a wage. The dangerous rule is ratification, sections 196 to 200. A person can adopt an act done in his name without authority, and the adoption relates back. He cannot ratify an act done in the agent’s own name with no mention of a principal, which is the English limit in Keighley, Maxsted v. Durant, and he must ratify the whole act, within a time when he himself could still have done it. The third protection is section 202. If the agency is coupled with an interest, for example the agent has advanced money and holds authority to sell the goods to recover it, the principal cannot revoke that authority to the prejudice of the interest. Finally, section 230: an agent is normally a pipe, not a party. He becomes personally liable when he hides the principal, pretends to be a principal, or deals for a foreign principal, or where there is a custom or a contract to that effect.",
      steps: [
        ["Creation", "Express authority, implied authority, necessity, or a later ratification of an unauthorised act."],
        ["What binds the principal", "Acts within actual or apparent authority. Section 226. The principal is also bound by the agent’s fraud or misrepresentation committed in the course of the business, section 238."],
        ["Agent’s duties", "Follow instructions or custom (section 211), use skill (section 212), render accounts (section 213), communicate difficulties (section 214), and not deal on his own account (sections 215 and 216)."],
        ["No delegation, section 190", "A delegate cannot delegate, unless the nature of the act, a custom, a ministerial part, or an emergency allows a sub-agent."],
        ["End of the agency, section 201", "Revocation, renunciation, completion, death, insanity, insolvency of the principal, or expiry. An agency coupled with interest survives revocation, section 202."]

      cards: [
        ["Who can be a principal, who can be an agent", "Section 183: a principal must be competent to contract. Section 184: any person may be an agent, even a minor. The minor agent is not responsible to the principal, because responsibility would be a contract with a minor. Third parties may still treat his authorised act as the principal’s act.", "A shop owner may send a 16-year-old assistant to deliver a bill and collect payment. The assistant can be an agent. The owner cannot sue the assistant on the agency contract."],
        ["How authority arises", "Express words. Implied authority from the circumstances and the ordinary course of that business, sections 186 to 188. Agency of necessity: a carrier or a person entrusted with perishable goods may do what is reasonably necessary to protect them when instructions cannot be obtained, section 189. Estoppel or holding out: if the principal’s conduct leads a third person to believe someone is his agent, he cannot later deny it as against that person.", "A wife left without means has, in some older cases, been treated as having authority to pledge her husband’s credit for necessaries. The modern safer analysis is necessity or holding out on the facts, not a blanket rule."],
        ["Ratification", "Section 196: the principal may elect to ratify or to disown an unauthorised act done for him. Section 197: ratification may be express or implied by conduct. Section 198: he must know the material facts, or be willing to take the risk of not knowing. Section 199: he must ratify the whole. Section 200: ratification cannot injure a third person’s interest which has already arisen. The act must have been done on behalf of the person who ratifies.", "An employee buys stock in the company’s name, beyond his limit. The board, with full knowledge, keeps the stock and sells it. That conduct ratifies the purchase."],
        ["Personal liability of the agent, section 230", "In the absence of a contract to the contrary, an agent cannot personally enforce, nor is he personally bound, where he was acting for a named principal. He is personally liable when he agrees to be, when he acts for an undisclosed principal, when he is a pretended agent, when the principal is a foreign principal, and when there is a usage of trade.", "A broker signs in his own name and never mentions a principal. The other side can hold the broker."],
        ["Undisclosed principal", "Sections 231 and 232: if the agent has contracted in fact for a principal who was not disclosed, the principal may require performance, subject to the rights the third person would have had against the agent. The third person may also elect to sue the agent or, when he discovers him, the principal. He cannot have a decree against both for the same claim.", "Goods are bought by a person who appears to be buying for himself, but is quietly buying for a mill. When the mill is discovered, the seller may look to the mill, with the same defences he had against the agent."],
        ["When the agency cannot be revoked", "Section 202: where the agent has himself an interest in the property which is the subject of the agency, the agency cannot, in the absence of an express contract, be terminated to the prejudice of that interest. Section 204: the principal cannot revoke after the authority has been partly exercised.", "A creditor is authorised to sell a specified stock and pay himself. The debtor cannot cancel that authority the evening before the sale."]

    {
      id: "c2u4",
      n: "Unit 4",
      title: "Sale of goods",
      syllabus: "Sale of Goods Act, 1930",
      idea: "A sale is a contract by which the seller transfers, or agrees to transfer, the property in goods to the buyer for a price. Property here means ownership, not the land.",
      analogy: "Possession is who holds the box. Property is whose box it is. Risk is who loses if the box is destroyed tonight. The Act’s main skill is seeing that these three can sit with three different people, and then learning the default rule: risk follows property unless the parties agree otherwise.",
      story: "A shopkeeper agrees on Monday to sell you a particular identified refrigerator, which is ready to be taken away, and you agree to collect it on Friday. Section 20 can pass ownership on Monday itself if the contract is unconditional, even though you have not taken it home. If the shop then burns on Wednesday, section 26 asks who bears the loss. If property had already passed, and neither of you agreed otherwise, the loss is yours, although you never touched the fridge. That is why the passing-of-property rules are not academic.",
      wider: "The Sale of Goods Act, 1930 was carved out of Chapter VII of the Contract Act so that merchants would have one readable code. The Contract Act still applies where the 1930 Act is silent, section 3. Two shifts of policy matter. First, caveat emptor, let the buyer beware, is still the opening rule of section 16, but it is riddled with implied conditions about title, description, sample, fitness and merchantable quality. Second, consumer law, which you will meet in the torts paper, pushes further, towards caveat venditor, let the seller beware, especially for defective products. Do not mix the two Acts in one sentence. A buyer under the 1930 Act must plead the implied condition. A consumer under the Consumer Protection Act, 2019 may have a product-liability claim without proving the old negligence story. Nemo dat quod non habet, section 27, says a non-owner cannot pass ownership. The exceptions exist because markets cannot function if every buyer must investigate the seller’s title like a detective.",
      steps: [
        ["Sale or agreement to sell, section 4", "If ownership passes now, it is a sale. If ownership is to pass later, it is an agreement to sell, and it becomes a sale when time elapses or conditions are fulfilled."],
        ["Conditions and warranties, sections 12 to 17", "A condition is essential. Breach lets the buyer reject. A warranty is collateral. Breach gives damages only. Section 16 is caveat emptor, with stated exceptions."],
        ["Property and risk, sections 18 to 26", "Specific goods and unascertained goods pass at different moments. Risk prima facie follows property."],
        ["Nemo dat, section 27", "A seller without title passes no title, subject to the exceptions the Act and other laws create."],
        ["Unpaid seller, sections 45 to 54", "Lien, stoppage in transit, and resale, plus a personal action for the price or for damages."]
      ],
      cards: [
        ["Goods", "Section 2(7): every kind of movable property, other than actionable claims and money. It includes stock and shares, growing crops, and things attached to land which are agreed to be severed. Existing, future and contingent goods are all possible subject matter. A contract for work and skill, where materials are incidental, is not a sale of goods. State of Madras v. Gannon Dunkerley used that line for works contracts in the old sales-tax law.", "A portrait painted for you is closer to a contract for skill. A ready-made fan taken off the shelf is a sale of goods."],
        ["Implied conditions you should be able to name", "Section 14: the seller has a right to sell, and the buyer will enjoy quiet possession. Section 15: in a sale by description, the goods must correspond with the description. Section 16(1): fitness for a purpose the buyer made known, relying on the seller’s skill, where the seller deals in such goods. Section 16(2): merchantable quality, now best understood as a saleable quality fit for the ordinary use, where the seller deals in goods of that description. Section 17: in a sale by sample, the bulk must correspond with the sample.", "You ask a chemist for a hot-water bottle and rely on him. It bursts in ordinary use. Priest v. Last is the picture of section 16(1). Grant v. Australian Knitting Mills is the picture of goods that were not of merchantable quality."],
        ["When a condition sinks to a warranty", "Section 13: the buyer waives the condition, or elects to treat the breach as a breach of warranty, or, in a contract that is not severable, he has accepted the goods or part of them. Acceptance can cost him the right to reject, and leave him with damages.", "A buyer of cloth discovers the defect, keeps the bales, and starts cutting them. He may have lost rejection and be left with a claim for damages."],
        ["When ownership passes", "Unascertained goods: no property passes until the goods are ascertained, section 18. Specific goods in a deliverable state, unconditional contract: property passes when the contract is made, regardless of payment or delivery, section 20. If the seller must do something to put them in a deliverable state, property passes when that is done and the buyer has notice, section 21. If the price is to be fixed by weighing or measuring, section 22. Unascertained or future goods: property passes when goods of that description, in a deliverable state, are unconditionally appropriated with the assent of both, section 23.", "Twenty bags out of a warehouse of two hundred are not yours until twenty particular bags are set aside with both sides’ assent."],
        ["Sale by a non-owner", "Section 27 is nemo dat. Exceptions you should be able to list: estoppel; sale by a mercantile agent in possession with consent (proviso to section 27); sale by a joint owner in sole possession, section 28; sale under a voidable title before it is avoided, section 29; seller in possession after sale, section 30(1); buyer in possession, section 30(2); and an unpaid seller’s resale under section 54. A thief does not come within these exceptions.", "A jeweller leaves stock with an agent to sell. The agent sells in the ordinary course to a good-faith buyer. The buyer can get a title the agent himself did not fully have."],
        ["Unpaid seller", "Section 45: he is unpaid if the whole price has not been paid or tendered, or if a bill or cheque he received has been dishonoured. Against the goods: lien while he is in possession (sections 47 to 49), stoppage in transit if the buyer becomes insolvent (sections 50 to 52), and a limited right of resale (section 54). Against the buyer personally: suit for the price (section 55) or for damages (section 56).", "Goods are on a truck between the seller’s city and the buyer’s city. The buyer is declared insolvent. The seller may stop them in transit."]
      ],
      cites: [
        "Sale of Goods Act, 1930, sections 4 and 2(7) (sale and goods), 12 to 17 (conditions, warranties, caveat emptor), 18 to 26 (property and risk), 27 to 30 (nemo dat and exceptions), 31 to 44 (delivery), 45 to 54 (unpaid seller).",
        "Indian Contract Act, 1872, section 3 of the Sale of Goods Act — the Contract Act continues to apply where the 1930 Act is silent.",
        "Priest v. Last (1903) — fitness for purpose where the buyer relied on the seller.",
        "Grant v. Australian Knitting Mills (1936) — goods not of merchantable quality.",
        "Rowland v. Divall (1923) — failure of the condition that the seller had a right to sell.",
        "State of Madras v. Gannon Dunkerley and Co. (1958) — a works contract is not, as such, a sale of goods. Useful for the boundary of the Act."
      ],
      quiz: [
        { q: "Caveat emptor is", options: ["An absolute rule with no exceptions", "The rule in section 16, subject to implied conditions as to fitness and merchantable quality", "A rule that the seller is always liable"], a: 1, why: "Let the buyer beware is the start of section 16. The implied conditions are the exceptions you must write in the same answer." },
        { q: "Risk under section 26", options: ["Always stays with the seller until delivery", "Prima facie follows the property, unless otherwise agreed", "Always passes when the price is paid"], a: 1, why: "Property and risk are separate ideas. The default is that they travel together." }

    {
      id: "c2u5",
      n: "Unit 5",
      title: "Partnership",
      syllabus: "Indian Partnership Act, 1932",
      idea: "Partnership is the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all. The last words — acting for all — are the real test.",
      analogy: "Sharing the rent of a house does not make the tenants partners. Sharing the profit of a dhaba, where each can bind the others by buying supplies for that dhaba, does. The key in the lock is mutual agency: every partner is both agent and principal of the others.",
      story: "Three friends open a tuition centre. Only one teaches, one keeps the accounts, and one never visits, but all three share profits and any of them may hire a bench in the centre’s name. The silent friend is still a partner. If the centre is not registered and a parent does not pay, section 69 can stop the firm from suing that parent on the contract. The parent can still sue the firm. Non-registration hurts the firm’s sword, not the outsider’s sword.",
      wider: "The Partnership Act, 1932 replaced Chapter XI of the Contract Act. It is still a contract, so the Contract Act applies where this Act is silent. The policy choice is unlimited liability. Unlike a company or an LLP, a partner’s personal assets stand behind the firm’s debts. That is why the tests of who is a partner are strict. Cox v. Hickman is the root: profit-sharing is evidence, not the definition. Section 6 writes that down. Mutual agency is the definition. Registration is optional, which surprises students who know companies. The price of not registering is section 69, a procedural bar on suits by the firm and by partners to enforce contractual rights. Haldiram Bhujiawala holds that the bar does not extend to a right that comes from statute or from general law, such as a suit to stop passing off. A minor cannot be a full partner. Section 30 lets him be admitted to the benefits, with a choice within six months of majority. Death of one partner in a two-person firm dissolves the firm, because a partnership cannot exist as one person. A clause that the business shall continue works only if a new partner actually comes in.",
      steps: [
        ["The four essentials, section 4", "An agreement, a business, sharing of profits, and mutual agency. Section 5: partnership is not created by status. A Hindu undivided family is not a partnership."],
        ["The test, section 6", "Look at the real relation. Sharing profits, or gross returns, does not of itself make a person a partner."],
        ["Inside the firm, sections 9 to 17", "Utmost good faith, indemnity for fraud, equal rights in the conduct of the business unless agreed otherwise, and the firm’s property."],
        ["Outside the firm, sections 18 to 30", "Each partner is an agent. Implied authority has clear limits in section 19(2). Holding out, section 28. A minor admitted to benefits, section 30."],
        ["Change and ending, sections 31 to 55", "Incoming and outgoing partners, and dissolution, followed by settling of accounts."]
      ],
      cards: [
        ["Who is not a partner", "Joint owners who share rent. Members of a club. A lender who is paid a share of profits as interest, if the contract is really a loan. A servant or agent paid by a share of profits. Section 6 and the explanations point you to the contract as a whole. Champaran Cane Concern is the Indian reminder that profit-sharing is not conclusive.", "A landlady takes 10 percent of a shop’s profit instead of rent. Call her a partner only if she also has a say that binds the business, not because of the percentage alone."],
        ["Registration and section 69", "Registration with the Registrar of Firms is not compulsory for existence. An unregistered firm cannot sue a third person to enforce a right arising from a contract. A partner cannot sue the firm or a co-partner to enforce a right arising from a contract. The disabilities do not stop a suit for dissolution, or for accounts of a dissolved firm, or a set-off of a small sum, and they do not stop a third person suing the firm. Haldiram: a right under general law, such as passing off, is not a right arising from a contract and is not barred.", "The firm can still be sued. It cannot use its own unregistered status as a defence when a supplier sues it."],
        ["Implied authority, and its limits", "Section 19(1): the act of a partner which is done to carry on the usual business, in the usual way, binds the firm. Section 19(2) lists what is not implied: submitting a dispute to arbitration, opening a bank account in his own name, compromising or relinquishing a claim, withdrawing a suit, admitting liability in insolvency proceedings, acquiring or transferring immovable property, and entering into partnership on behalf of the firm.", "A partner may buy the shop’s usual stock. He may not, on implied authority alone, mortgage the shop building."],
        ["Kinds of partners", "Active partner: takes part and is known. Sleeping or dormant partner: shares profits, does not take part, and is still liable for the firm’s acts. Nominal partner: lends his name and is liable to those who gave credit on that name. Partner by holding out, section 28: he represents himself, or knowingly allows himself to be represented, as a partner. Partner in profits only: shares profits, not losses, as between the partners. That internal deal does not cut down the liability to outsiders.", "A famous person’s name is put on the board with his consent, though he invested nothing. A supplier who trusted that name can hold him under section 28."],
        ["Minor, section 30", "He may be admitted to the benefits with the consent of all partners. He is not personally liable. His share in the property and profits is liable. He may inspect accounts. He cannot sue the partners for an account or payment of his share except when he severs his connection. Within six months of attaining majority, or of learning that he was admitted, whichever is later, he must give public notice whether he elects to become a partner. Silence means he is deemed to have become one.", "A minor who stays silent for six months after his 18th birthday steps into full liability from that point, including for later debts."],
        ["Dissolution", "By consent, or by a contract between the partners, section 40. Compulsory, section 41: all partners but one are insolvent, or the business has become unlawful. On contingencies in the contract, section 42, including death or insolvency unless the contract says otherwise. By notice, if it is a partnership at will, section 43. By the court, section 44: unsound mind, permanent incapacity, misconduct, persistent breach, transfer of the whole interest, the business being carried on only at a loss, or just and equitable grounds. After dissolution, section 45 continues partners’ liability until public notice. Section 48 settles accounts in a fixed order. Goodwill may be sold, and the sellers may agree a reasonable restraint, section 55 and section 54.", "Two partners, no deed about death. One dies. The firm dissolves. The heir does not become a partner by inheritance."]
      ],
      cites: [
        "Indian Partnership Act, 1932, sections 4, 5 and 6 (definition and test), 9 to 17 (partners among themselves), 18 to 30 (third parties and minors), 31 to 38 (incoming and outgoing), 39 to 55 (dissolution), 58, 59 and 69 (registration and its effect).",
        "Cox v. Hickman (1860) — mutual agency, not profit-sharing, is the real test.",
        "Champaran Cane Concern v. State of Bihar (1963) — sharing profits does not by itself create a partnership.",
        "Haldiram Bhujiawala v. Anand Kumar Deepak Kumar (2000) — section 69(2) bars enforcement of a contractual right by an unregistered firm. It does not bar a statutory right or a common-law right such as passing off.",
        "Commissioner of Income Tax v. Seth Govindram Sugar Mills (1965) — a partnership of two persons dissolves on the death of one. It cannot continue as a one-person firm."
      ],
      quiz: [
        { q: "The real test of partnership is", options: ["Sharing of profits alone", "Mutual agency: the business is carried on by all or any of them acting for all", "Having a written deed and a PAN number"], a: 1, why: "Section 4 and Cox v. Hickman. Section 6 says profit-sharing is not enough." },
        { q: "An unregistered firm", options: ["Does not exist in law", "Exists, but cannot sue to enforce a contractual right, section 69", "Cannot be sued by its suppliers"], a: 1, why: "Existence and the right to sue are different. Outsiders can still sue the firm." }
      ]

    {
      id: "c2u6",
      n: "Unit 6",
      title: "Negotiable instruments",
      syllabus: "Negotiable Instruments Act, 1881",
      idea: "A negotiable instrument is a signed paper containing a right to money, which passes from hand to hand so that a person who takes it in good faith can get a better title than the person he took it from.",
      analogy: "A bus ticket is just proof of a contract. A ten-rupee note moves value by delivery. A cheque, a promissory note and a bill of exchange sit in between: they are paper, but the law lets them move almost like money, so that traders need not carry cash.",
      story: "A shop takes your cheque for a phone. You later stop payment because you changed your mind about the colour, though you owed the price. The bank returns the cheque. If the debt was legally enforceable, the cheque was presented in time, the shop gave you written notice within thirty days of learning of the return, and you did not pay within fifteen days of that notice, section 138 can make the dishonour an offence. A quarrel about the colour is not, by itself, a defence.",
      wider: "The Act of 1881 is a commercial code sitting on top of the Contract Act. Its moral exception to nemo dat is the holder in due course, section 9. Markets cannot stop to investigate every previous theft of a bill, so a person who takes the instrument for value, in good faith, and before it is overdue, gets a clean title even if a previous hand had a defective one. That privilege is the whole point of negotiability, and it is also why alteration, forgery and overdue paper are taken so seriously: they destroy the privilege. Section 138, inserted much later, is a different idea. It uses the criminal court to make cheques credible. The ingredients are technical because the offence is a statutory one, not a general fraud. Jurisdiction was settled by Parliament after Dashrath Rupsingh Rathod. Do not cite that case as the present rule of place. The 2015 amendment to section 142(2) puts the complaint in the court where the payee’s bank branch is, if the cheque was delivered there for collection, or where the drawer’s bank branch is, if it was presented otherwise. Presumptions in sections 118 and 139 mean that once the signature and the dishonoured cheque are shown, the court presumes consideration and a legally enforceable debt. Rangappa v. Sri Mohan holds that this presumption includes the debt. The accused may rebut it on a preponderance of probability. He need not prove his defence beyond reasonable doubt.",
      steps: [
        ["Three instruments", "Promissory note, section 4: a written unconditional promise to pay a certain sum to a person or order or bearer. Bill of exchange, section 5: a written unconditional order by the drawer to the drawee to pay. Cheque, section 6: a bill drawn on a banker, payable on demand. A cheque now includes an electronic image and a truncated cheque."],
        ["Negotiation", "To bearer, by delivery. To order, by endorsement and delivery. Sections 14, 15 and 46."],
        ["Holder in due course, section 9", "A person who possesses the instrument for consideration, before maturity, in good faith, without notice of a defect in the title of the person who negotiated it."],
        ["Dishonour", "Non-acceptance or non-payment. Notice of dishonour, section 93. Noting and protest for foreign and other bills, sections 99 and 100."],
        ["Cheque bounce, section 138", "Legally enforceable debt, presentation within validity, return unpaid, notice within 30 days of knowledge, 15 days to pay, complaint within one month after that, by the payee or the holder in due course."]
      ],
      table: {
        caption: "The three instruments",
        heads: ["", "Promissory note", "Bill of exchange", "Cheque"],
        rows: [
          ["Nature", "A promise.", "An order.", "An order on a banker."],
          ["Parties", "Maker and payee.", "Drawer, drawee, payee.", "Drawer, drawee bank, payee."],
          ["Acceptance", "None. The maker is already bound.", "The drawee becomes liable by acceptance.", "No acceptance. The bank pays or returns it."],
          ["Grace and demand", "May be on demand or after a time.", "The same.", "Always payable on demand."]
        ]
      },
      cards: [
        ["What makes paper negotiable", "The sum must be certain. The promise or order must be unconditional. It must be in writing and signed. It must be transferable by delivery, or by endorsement and delivery. A receipt, an IOU that does not contain an unconditional promise, and a cheque crossed account payee in a way that stops further negotiation, sit at the edges. If the question gives you the words, test them against sections 4, 5 and 6 rather than against the heading on the paper.", "I owe you Rs 5,000 is not a promissory note. I promise to pay you or your order Rs 5,000, signed, is."],
        ["Holder and holder in due course", "Section 8, the holder, is the person entitled in his own name to the possession of the instrument and to receive the money. Section 9, the holder in due course, is a holder who also gave consideration, took it in good faith, and took it before it became due, without notice of defect. Section 58: a person who gets the instrument by fraud or for an unlawful consideration cannot pass a better title, except to a holder in due course.", "A stolen bearer cheque, passed for value to a shopkeeper who knows nothing of the theft and takes it before anything looks overdue, can give that shopkeeper a title the thief never had."],
        ["Presumptions, sections 118 and 139", "Until the contrary is proved, the court presumes consideration, the date, the time of acceptance and endorsement, the order of endorsements, and that a lost instrument was duly stamped. Section 139 adds, for a cheque offence, a presumption that the cheque was for a legally enforceable debt. Rangappa confirms that the presumption covers the existence of the debt. Bir Singh confirms that a signed blank cheque, voluntarily given and later filled within authority, can still attract the presumption.", "The drawer who says it was a signed blank cheque still has to show, on probability, that there was no debt. The shop does not begin by proving the debt from zero."],
        ["The section 138 calendar", "The cheque must be presented within its validity, which is three months from its date. The bank returns it unpaid for insufficiency, or because it exceeds the arrangement, or it is stopped in a way that still leaves the debt unpaid. Written notice demands the amount within 30 days of the payee receiving information from the bank. The drawer has 15 days from receipt of notice to pay. If he does not, the cause of action arises on the 16th day, and the complaint must be filed within one month. A stop-payment instruction does not by itself save the drawer: Modi Cements.", "Count the dates on a question before you discuss guilty or not guilty. A late notice ends the offence even if the cheque was dishonest."],
        ["Where the complaint is filed", "Section 142(2), after the 2015 amendment: if the cheque was delivered to a bank for collection, the court at the place of the branch where the payee maintains the account. If the cheque was presented by the payee otherwise, the court at the place of the drawer’s bank branch. Dashrath Rupsingh Rathod (2014) had placed the offence at the drawer’s bank. Parliament changed that. Cite Dashrath only to say it is no longer the rule of jurisdiction.", "A cheque drawn on a Nagpur bank, deposited by the payee into his Bengaluru account, is complained of in Bengaluru, not in Nagpur."],
        ["Companies, section 141", "If the offence is by a company, every person who was in charge of and responsible for the conduct of the business at the time, as well as the company, can be proceeded against. A director is not liable merely because he holds the title. The complaint must say how he was in charge. Nominated directors and independent directors have a further protection if they were not involved.", "Naming every director in a cheque complaint, with no averment of responsibility, is a defective complaint."]
      ],
      cites: [
        "Negotiable Instruments Act, 1881, sections 4, 5, 6, 8, 9, 10, 13, 14, 15, 58, 87, 91 to 93, 99, 100, 118, 138, 139, 141 and 142.",
        "Negotiable Instruments (Amendment) Act, 2015, section 142(2) — the present rule of territorial jurisdiction.",
        "Rangappa v. Sri Mohan (2010) — the section 139 presumption includes a legally enforceable debt or liability.",
        "Bir Singh v. Mukesh Kumar (2019) — a signed blank cheque, filled in accordance with the authority given, can found a section 138 prosecution.",
        "Modi Cements Ltd. v. Kuchil Kumar Nandi (1998) — a direction to the bank to stop payment does not, by itself, take the case out of section 138.",
        "Dashrath Rupsingh Rathod v. State of Maharashtra (2014) — older jurisdiction rule. Do not apply it after the 2015 amendment."
      ],
      quiz: [

        { q: "After the 2015 amendment, a cheque deposited in the payee’s bank is tried", options: ["Only where the drawer lives", "At the payee’s bank branch where it was delivered for collection", "Only in New Delhi"], a: 1, why: "Section 142(2). Dashrath Rupsingh Rathod is the earlier view Parliament departed from." }

    {
      id: "c2u7",
      n: "Unit 7",
      title: "Limited liability partnership",
      syllabus: "Limited Liability Partnership Act, 2008",
      idea: "An LLP is a body corporate, separate from its partners, with perpetual succession. A partner is not personally liable for another partner’s wrong, and his own liability is limited to what he agreed to contribute, except where he himself is fraudulent or negligent.",
      analogy: "A traditional partnership is a shared kitchen where each cook’s mistake can be collected from every cook’s house. An LLP is a restaurant company with a lighter rulebook: the restaurant pays, and a cook pays beyond his share only for his own fraud or his own wrongful act. The restaurant does not die when one cook resigns.",
      story: "Two architects want to practise together. They do not want a private limited company, with its heavier compliance, and they do not want a traditional firm, because one partner’s negligence could take the other’s house. They incorporate an LLP, file an incorporation document, keep at least two designated partners of whom one is resident in India, and write an LLP agreement. A client who is harmed by one partner’s negligent drawing sues the LLP. The innocent partner’s personal savings are not the client’s first target.",
      wider: "The Act of 2008 was a policy bridge. Professionals and small businesses wanted the contractual freedom of a partnership and the separate personality of a company. Section 3 gives the LLP separate legal entity and perpetual succession. Section 4 says the Partnership Act, 1932 does not apply. The internal bargain is contractual: section 23 says the LLP agreement governs mutual rights, and the First Schedule applies only where the agreement is silent. The external bargain is corporate: a partner is an agent of the LLP, not of the other partners, section 26. That one sentence is the contrast with section 18 of the Partnership Act, where every partner is an agent of the others. Liability becomes unlimited only in the cases the Act marks out, especially fraud under section 30, where the person concerned can be made personally liable without limit. The LLP itself remains liable to the same extent as the fraudulent partner, unless the fraud was without the knowledge or authority of the LLP. Winding up can be voluntary or by the Tribunal. Conversion provisions let a firm or a company move into the LLP form without pretending the business is a brand-new person in every practical sense, though the legal entity changes.",
      steps: [
        ["Nature, section 3", "A body corporate, a legal person separate from its partners, with perpetual succession. It can sue and be sued, and hold property, in its own name."],
        ["Who must be there", "At least two partners, section 6. At least two designated partners, and at least one of them resident in India, section 7. A body corporate may itself be a partner."],
        ["Birth", "An incorporation document and a statement are filed with the Registrar, sections 11 and 12. On registration the LLP comes into existence, section 14."],
        ["Inside and outside", "The agreement, or the First Schedule, governs partners. A partner binds the LLP by an act in the usual business, or with authority, section 27. He does not, merely as partner, bind the other partners."],
        ["Money, investigation, end", "Statement of account and solvency, and an annual return, section 34. The Central Government may investigate, sections 43 to 49. Compromise and reconstruction, sections 60 to 62. Winding up, sections 63 and 64."]
      ],
      table: {
        caption: "Firm, company, LLP",
        heads: ["", "Partnership firm", "Company", "LLP"],
        rows: [
          ["Separate legal person", "No. Partners and firm are not a full separate entity in the company sense.", "Yes.", "Yes. Section 3."],
          ["Liability", "Unlimited, joint and several.", "Limited to unpaid shares, or the guarantee.", "Limited to the agreed contribution, with personal liability for one’s own fraud or wrongful act."],
          ["Agency", "Every partner is agent of the others.", "Directors act for the company under company law.", "A partner is agent of the LLP, not of the other partners."],
          ["Creation", "Agreement. Registration optional.", "Incorporation compulsory.", "Incorporation compulsory."]
        ]
      },
      cards: [
        ["Designated partners", "They are responsible for doing the acts the Act requires of the LLP, including filings. If no designated partner is named, or none qualifies, every partner is treated as one. At least one must have stayed in India for the period the Act requires of a resident.", "A foreign partner may be a designated partner, but he cannot be the only one. Someone resident in India must share the compliance seat."],
        ["The agreement and the First Schedule", "Mutual rights and duties are what the partners write. If they do not write them, the First Schedule supplies default rules, in the same spirit as the default rules in the Partnership Act: share equally, decide ordinary matters by majority, keep true accounts, and not compete with the LLP without consent.", "Two partners who never sign an agreement are not free of duties. The First Schedule fills the silence."],

      story: "A driver employed to deliver goods takes a long detour to see a friend and injures a pedestrian on that detour. If the detour is a new journey of his own, the employer is not liable. If he is still on the delivery and only does the delivery badly, or by a slightly different route, the employer is liable. The hard line is between a wrongful mode of doing the authorised work and a wholly unauthorised journey.",
      wider: "The justification is practical, not moral guilt. The employer chose the servant, profits from the work, and is more likely to be able to pay and to insure. The control test asks whether the employer could tell the person not only what to do but how to do it. Hospitals and skilled professionals broke that test, because a surgeon is not controlled in how he cuts. The organisation or integration test then asks whether the work is part of the employer’s business or only accessory to it. An independent contractor is generally not a servant. The employer is not vicariously liable for the contractor’s collateral negligence. He remains liable if he authorised the wrong, if the duty was non-delegable, if the work is inherently dangerous, or if a statute puts the duty on him personally. A borrowed servant is judged by who had the power of control at the time of the tort, not by who pays the monthly wage. Ratification works here as it does in agency: if the employer adopts the wrongful act with knowledge, he can be liable as if he had authorised it.",

      wider: "Assault and battery are trespasses to the person. They are actionable without proof of money loss, which is injuria sine damno again. Consent, self-defence and lawful arrest are the defences. False imprisonment requires a total restraint. Bird v. Jones holds that blocking one route, while other ways remain, is not imprisonment. The person need not know of the imprisonment at the time, which is Meering. Defamation protects reputation among ordinary right-thinking people. Publication to at least one person other than the plaintiff is essential. Libel is a defamation in a permanent form. Slander is spoken or transient. Criminal defamation still exists in India, now under the Bharatiya Nyaya Sanhita, but this paper is the civil action. Defences are truth for the public good in the criminal law, and in civil law justification, fair comment on a matter of public interest, and privilege. Absolute privilege covers statements in Parliament and in judicial proceedings. Qualified privilege covers a statement made under a duty or interest, and it fails if the plaintiff proves malice. Malicious prosecution is the tort that fills the gap when a person misuses the criminal court. The plaintiff must show prosecution by the defendant, termination in the plaintiff’s favour, absence of reasonable and probable cause, malice, and damage. Nervous shock means a recognised psychiatric injury, not grief or a startle. The duty depends on foreseeability. A person who sees a horrifying event caused by the defendant’s negligence may recover if he is within the class the law treats as foreseeable. Mere sorrow at bad news is not enough.",

      story: "In Rylands v. Fletcher a mill owner had a reservoir built. Water escaped through old mine shafts and flooded the neighbour’s mine. There was no proven negligence by the owner himself. The court still held him liable: a person who brings and keeps on his land something likely to do mischief if it escapes, must keep it at his peril. In 1985 oleum gas leaked from a unit in Delhi. In M.C. Mehta the Supreme Court laid down absolute liability for an enterprise engaged in a hazardous or inherently dangerous activity. Bhopal and the Machhu dam disaster are studied beside that rule as pictures of industrial harm on a scale the old defences were never designed for. The legal turning point you cite is M.C. Mehta, not a finding that the Bhopal settlement itself invented the doctrine.",
      wider: "Rylands requires a non-natural use of land, a bringing and keeping, an escape, and damage. The defences are the plaintiff’s consent, the plaintiff’s own default, act of God, the act of a stranger, and statutory authority. M.C. Mehta holds that those exceptions do not apply to a hazardous enterprise. The measure of compensation must have a deterrent effect and should be correlated to the magnitude and capacity of the enterprise. That is a policy judgment about industrial India, not a restatement of an English reservoir. Nuclear installations are in your syllabus as the modern example of a thing that cannot be made safe by saying the operator was careful. Statutes then add their own no-fault schemes. The Public Liability Insurance Act, 1991 requires insurance for accidents involving hazardous substances, so that immediate relief is not delayed by a long trial of fault. Motor and railway statutes do similar work for their own accidents.",

      wider: "Remoteness of damage in tort moved from a directness test to a foreseeability test. Re Polemis held a defendant liable for the direct fire even if he could not foresee fire, only a splash. The Wagon Mound (Overseas Tankship v. Morts Dock) replaced that, for negligence, with foreseeability of the kind of damage. You should name both, and apply Wagon Mound as the later test. Heads of damages include nominal damages, where a right is broken and no real loss is shown; general damages, for non-pecuniary harm such as pain; special damages, for particular money losses which must be pleaded; and aggravated or exemplary damages, where the defendant’s conduct insulted the plaintiff or where a public-law wrong needs a deterrent sum. Exemplary damages are exceptional. The aim of tort is still compensation. Extra-legal remedies in the syllabus are recaption of goods, peaceful re-entry on land, distress damage feasant, and abatement of nuisance. Distress damage feasant is the old right to seize a straying animal that is actually doing damage, until compensation is paid. Abatement means removing a nuisance yourself, without unnecessary damage, and usually after notice if the removal requires entering another’s land. These are dangerous remedies because a person who exceeds them commits a tort of his own.",

      analogy: "Caveat emptor tells the buyer: open the sack before you pay. Caveat venditor tells the seller: if you put the sack into the market, you answer for what is inside. Tort moved from the first sentence towards the second. The Consumer Protection Act, 2019 writes the second sentence into a procedure ordinary people can use.",
      story: "A mixer sold in a sealed box catches fire in ordinary use and burns a hand. Under Donoghue the user may sue the manufacturer in negligence, and must prove a failure of care. Under the product-liability chapter of the 2019 Act the claim is that the product was defective and caused harm. The consumer does not have to reconstruct the factory’s negligence, though the manufacturer has statutory defences, including misuse and alteration.",
      wider: "This unit joins the two halves of the paper. Duty of care is Donoghue and the professional cases, including V.P. Shantha. Caveat emptor is section 16 of the Sale of Goods Act. Caveat venditor is the direction of consumer law and of product-liability statutes. The European Product Liability Directive of 1985 made the producer of a defective product strictly liable for personal injury and for damage to consumer property. Your syllabus calls it the EEC directive. India’s Chapter VI of the 2019 Act is not a copy of that directive, but the policy is the same: the cost of a defective product should fall on the person who put it on the market, not on the person who could not open the sealed unit and inspect the wiring. A consumer, defined in section 2(7), includes a person who buys goods or hires services for a consideration, and includes online transactions. It excludes a person who obtains goods for resale or for a commercial purpose, with an exception for goods or services used to earn a livelihood by self-employment. Complaints go to a District, State or National Commission according to the value of the consideration paid, not according to the damages the complainant feels like claiming. The Act’s own text set the District ceiling at one crore rupees and allowed the Central Government to prescribe another value. The 2021 Jurisdiction Rules prescribed: District Commission up to 50 lakh rupees, State Commission above 50 lakh and up to 2 crore, National Commission above 2 crore. Those rules are the working figures. If a later notification has changed them, the later notification wins, because the Act itself allows the figure to be prescribed. Product liability is Chapter VI, sections 82 to 87. A product manufacturer is liable for a manufacturing defect, a design defect, a deviation from specifications, or a failure to give adequate instructions and warnings. A product service provider is liable for a deficient or inadequate service, and a product seller in the situations the Act lists. Hazardous industrial activity loops back to M.C. Mehta and the Public Liability Insurance Act. The right to pass and repass on a public path is a public right. Blocking it is a public nuisance, and a person who suffers special damage, or who is given standing by a statute, may complain.",
      steps: [
        ["Who is a consumer", "Buys goods or hires or avails services for consideration, including online. Not for resale or a commercial purpose, with the livelihood exception."],
        ["Against whom", "The trader, the manufacturer, the service provider, and, for product liability, the persons Chapter VI names."],
        ["For what", "Defect, deficiency, unfair trade practice, and harm from a defective product."],

      story: "In 1858 the Crown took over from the East India Company. Laws then slowly admitted Indians into councils, but the British kept the real power and answered protests with statutes like the Rowlatt Act, which allowed detention without the ordinary trial. The Jallianwala Bagh firing of 13 April 1919 made that kind of power visible. By 1946 the answer was no longer a larger council. It was a Constituent Assembly writing a constitution for a people who would limit their own future governments.",
      wider: "Read the statutes as a ladder, not as a list to memorise without a reason. 1858 puts the Crown in the Company’s place. The Councils Acts of 1861 and 1892 add Indian members without responsible government. The Indian Councils Act, 1909, the Morley-Minto reforms, adds separate electorates for Muslims. That device later becomes a fault-line in the freedom movement: representation by community rather than by a common roll. The Government of India Act, 1919, the Montagu-Chelmsford reforms, introduces dyarchy in the provinces. Some subjects are transferred to ministers responsible to the legislature. Reserved subjects stay with the Governor. The Government of India Act, 1935 is the immediate parent of the Constitution. It provides provincial autonomy, a federal scheme which was not fully brought into force, a Federal Court, and lists of legislative subjects that reappear, rearranged, as the Seventh Schedule. The Constituent Assembly was created under the Cabinet Mission Plan of 1946, first met on 9 December 1946, and acted as a sovereign drafting body after Independence. Dr Rajendra Prasad presided. The Drafting Committee of 29 August 1947 was chaired by Dr B.R. Ambedkar. The Constitution was adopted on 26 November 1949 and most of it came into force on 26 January 1950. Salient features, for an answer, are: a written and lengthy constitution, a blend of rigidity and flexibility, federal structure with a strong Centre, parliamentary government, fundamental rights, directive principles, an independent judiciary, secularism, single citizenship, universal adult franchise, and a power of amendment that is itself limited by the basic structure. Sovereignty in this unit means the authority of the people, announced in the Preamble as We the People. It does not mean that Parliament can do anything. That second question is Unit 8 of Paper V, and the case is Kesavananda Bharati.",

      cards: [
        ["Social reform and political independence", "One current in the national movement said Indian society had to be reformed, in caste, gender and religion, before or along with political freedom. Another said political independence was the first fight, and social questions could wait or would be decided by Indians themselves. The Constitution refuses the choice. It is a political document and a social document: fundamental rights, abolition of untouchability, and directive principles are the social reform written into the political independence.", "Tilak’s emphasis on swaraj and the reformers’ campaigns against social practices are the two pressures you should be able to describe without caricaturing either."],
        ["Rowlatt, Jallianwala, Tilak", "The Rowlatt Act, 1919 continued restrictions associated with wartime and allowed detention with a truncated trial. The protest against it is the immediate context of Jallianwala Bagh. Bal Gangadhar Tilak was tried for sedition under section 124A of the Penal Code, in 1897 and again in 1908. Those trials made a legal point that later becomes a constitutional one: a government that defines political speech as sedition is the kind of government fundamental rights were written to restrain.", "When you reach freedom of speech, connect it back to this page rather than treating Article 19 as if it had no history."],

      story: "Parliament wants to create a new State out of an old one, change a boundary, and alter the First Schedule. Articles 3 and 4 let it do that by a law passed like an ordinary law, with the extra political step that the President refers the Bill to the affected State legislature for its views, which Parliament is not bound to accept. That law is expressly not to be treated as an amendment under Article 368. The map can change without the special majority required for a constitutional amendment.",
      wider: "The Preamble’s words — Sovereign, Socialist, Secular, Democratic, Republic, Justice, Liberty, Equality, Fraternity — are purposes. Socialist and Secular were added by the 42nd Amendment in 1976. They described a character the Constitution already had. They did not, by themselves, create a new enforceable right. Berubari Union (1960) said the Preamble is not a part of the Constitution and is not a source of power. Kesavananda Bharati (1973) holds that it is a part of the Constitution, that it can be used to interpret ambiguous provisions, and that it is not a source of prohibitions or of independent power. Citizenship at the commencement is Articles 5 to 8. After commencement, citizenship is governed by parliamentary law under Article 11, which is the Citizenship Act, 1955. Domicile in Article 5 is the idea of a permanent home, the country where a person intends to reside indefinitely. Article 9 says that a person who voluntarily acquires the citizenship of another country ceases to be an Indian citizen. Article 13 is the teeth of Part III. Law includes an ordinance, an order, a bye-law, a rule, a regulation, a notification, and custom or usage having the force of law. A law in force before 1950 which is inconsistent with fundamental rights is void to the extent of the inconsistency, Article 13(1). The State shall not make such a law after 1950, Article 13(2). Article 13(4), added later, says that a constitutional amendment under Article 368 is not law for the purpose of Article 13. That sentence is part of the fight you will study with Golaknath and Kesavananda. Do not treat Article 13 as if it could strike down an amendment. The limit on amendments is the basic structure, not Article 13.",

      story: "A school run by a linguistic minority wants to choose its principal and also wants a government grant. Article 30(1) protects the right to establish and administer educational institutions of its choice. The grant does not cancel that right, and the State may still insist on standards of education, sanitation and the welfare of teachers and students. T.M.A. Pai is the case that tries to hold both halves: autonomy in administration, and a State interest in standards.",
      wider: "Articles 25 to 28 are the religion clauses. Article 25 is freedom of conscience and the right freely to profess, practise and propagate religion, subject to public order, morality, health, and the other provisions of Part III. Propagation was held in Rev. Stainislaus not to include a right to convert another person by force, fraud or inducement. The State may regulate economic, financial, political or other secular activity associated with religious practice, and it may provide for social welfare and reform. Article 26 gives a religious denomination the right to manage its own affairs in matters of religion. The Shirur Mutt case is the source of the essential-religious-practice idea: what is essential to a religion is, in the first place, ascertained with reference to the doctrine of that community, and courts have in fact supervised that claim. That supervision is controversial, and you should present it as the court’s test, not as a simple definition. Article 27 bars a tax whose proceeds are specifically appropriated for the promotion of a particular religion. Article 28 limits religious instruction in educational institutions wholly maintained by the State. Minorities, for Articles 29 and 30, are determined State-wise, not nationally, after T.M.A. Pai. Article 29(1) protects the culture and language of any section of citizens, not only a numerical minority. Article 30 is specifically for religious and linguistic minorities. Pramati holds that the Right of Children to Free and Compulsory Education Act does not apply so as to force minority schools, under Article 30, into a form of admission that would destroy their minority character. Article 29(2) is a separate equality rule: no citizen shall be denied admission into a State-maintained or State-aided institution on grounds only of religion, race, caste or language.",

      story: "A State reserves seats in public employment for communities that were kept out of education and office for generations. Article 16(4) permits reservation where the State is of the opinion that they are not adequately represented. Indra Sawhney holds that reservation under Article 16(4) should not normally exceed 50 percent, that creamy layer among the backward classes must be excluded, and that reservation is an application of equality, not its enemy. Later amendments and cases add promotion, consequential seniority, and the economically weaker sections. Learn Indra Sawhney first. Add the later layers only when the question asks for them.",
      wider: "Article 14 has two phrases. Equality before the law is the negative idea, associated with Dicey: no person is above the law. Equal protection of the laws is the positive idea, drawn from the Fourteenth Amendment of the United States: likes must be treated alike, and unlike may be treated differently. The older test is reasonable classification: an intelligible differentia, and a rational relation to the object of the statute. E.P. Royappa and Maneka Gandhi add that arbitrariness is the antithesis of equality. A law or a State action can fail Article 14 because it is arbitrary, even when the State recites a classification. Administrative discretion is valid only inside that fence. An uncontrolled power to pick favourites is itself unequal. Article 15 prohibits discrimination on religion, race, caste, sex or place of birth. Place of birth is not residence. A requirement of residence in a State can be valid under Article 16(3) if Parliament so provides. It is not saved by pretending it is place of birth. Article 15(3) allows special provision for women and children. Article 15(4) and Article 16(4) allow special provision and reservation for socially and educationally backward classes and for Scheduled Castes and Scheduled Tribes. Article 15(6) and Article 16(6), the 103rd Amendment, add economically weaker sections. Janhit Abhiyan (2022) upholds that amendment. Gender justice uses 15(1), 15(3) and 16. Air India v. Nergesh Meerza struck down service conditions that treated air hostesses as retiring on marriage or pregnancy. Navtej Singh Johar and Joseph Shine read dignity and sexual orientation and the old adultery offence through Articles 14 and 15. Article 17 abolishes untouchability. Article 29(2) is equality of admission. Article 325 is a single general electoral roll, and no person is ineligible for inclusion because of religion, race, caste or sex. It is the equality principle applied to the vote, which is why your syllabus places it here rather than     {

      story: "A newspaper is told how many pages it may print and at what price. Bennett Coleman treats a limit on pages and price as a limit on circulation, and therefore as a limit on the freedom of speech. The press is not given a separate article. It speaks through Article 19(1)(a). Contempt of court is one of the grounds in Article 19(2) on which speech may be restricted. A fair criticism of a judgment is not contempt. A statement that prejudices a pending trial can be.",
      wider: "The freedoms are: speech and expression; assembly peaceably and without arms; association; movement throughout India; residence and settlement; and profession, occupation, trade or business. Clause (f), the right to acquire, hold and dispose of property, was deleted by the 44th Amendment in 1978. Property from 1950 to 1978 was a fundamental right, and a long fight over land reform produced Articles 31A, 31B and 31C and the Ninth Schedule. After 1978, property is Article 300A in Part XII: no person shall be deprived of his property save by authority of law. It is a constitutional right, not a fundamental right. The remedy is Article 226, not Article 32, unless another fundamental right is also in play. K.T. Plantation holds that a law under Article 300A must still satisfy public purpose and must not be arbitrary. Freedom of the press includes the freedom to circulate, and, in later cases, a careful public right to know. It does not include a right to a particular page in a government newspaper. Grounds under Article 19(2), as they now stand, include sovereignty and integrity of India, security of the State, friendly relations with foreign States, public order, decency or morality, contempt of court, defamation, and incitement to an offence. Shreya Singhal struck down section 66A of the Information Technology Act because a restriction on speech must be narrowly drawn to one of these grounds, and vague annoyance is not a ground. The test of reasonableness is associated with V.G. Row: the nature of the right, the purpose of the restriction, the extent and urgency of the evil, and the proportion of the restriction.",

      wider: "Article 20 has three rules, and they apply to criminal law. Clause (1): no retrospective criminal offence and no penalty greater than the one available at the time of the act. A civil liability can be retrospective. A criminal one cannot. Clause (2): no person shall be prosecuted and punished for the same offence more than once. This is double jeopardy, and it requires a prosecution and a punishment. A departmental enquiry is not a prosecution. Clause (3): no person accused of an offence shall be compelled to be a witness against himself. Nandini Satpathy reads this generously for police questioning. Selvi holds that narcoanalysis, polygraph and brain-mapping, when compelled, are testimonial and hit Article 20(3) and also Article 21. Article 21 now includes, besides bare survival, dignity (Francis Coralie Mullin), livelihood (Olga Tellis), speedy trial (Hussainara Khatoon), legal aid, shelter, health, and privacy (Puttaswamy, 2017, which also overrules the majority in ADM Jabalpur). Article 22(1) and (2) are for an ordinary arrest: grounds, right to consult a lawyer, and production before a magistrate within twenty-four hours. Article 22(3) says those two clauses do not apply to an enemy alien or to a person detained under a law of preventive detention. Preventive detention is detention to prevent a feared act, not to punish a completed offence. The safeguards are in Article 22(4) to (7): an advisory board, communication of grounds, and the opportunity to make a representation. The twenty-four-hour rule is not the safeguard for preventive detention. Examiners set that trap.",

      story: "In 1951 Champakam Dorairajan struck down a communal quota in admissions because it violated the fundamental right to non-discrimination, even though the State said it was pursuing a directive principle. Rights prevailed. Over the next thirty years Parliament amended the Constitution so that some laws giving effect to directive principles would not be struck down for violating Articles 14 and 19. Minerva Mills then said the Constitution has a balance between rights and directive principles, and that destroying the rights in the name of the principles destroys the basic structure. The mature statement is harmony, not a permanent victory of one list over the other.",
      wider: "Article 12 defines the State for Part III: the Government and Parliament of India, the Government and the Legislature of each State, and all local or other authorities within the territory of India or under the control of the Government of India. Other authorities has been expanded to include bodies that are an instrumentality or agency of the government. Ajay Hasia lists the factors: government shareholding, government control, monopoly status conferred by the State, and functions of public importance closely related to governmental functions. A private company is not the State merely because it is regulated. Naresh Shridhar Mirajkar holds that a judicial order of a High Court, made in a proceeding, is not open to a writ under Article 32 as if the judge were an authority under Article 12. The remedy is appeal or review. A.R. Antulay later shows that a judicial direction which itself violates a fundamental right can be corrected by the Supreme Court. The careful sentence is: a court deciding a case is not the State for the purpose of a fresh Article 32 petition against its judgment. Article 31A protects laws providing for acquisition of estates and similar agrarian reforms from challenge under Articles 14 and 19. Article 31B protects Acts placed in the Ninth Schedule, but I.R. Coelho holds that laws inserted after 24 April 1973 can still be tested on the basic structure. Article 31C, as it survives, protects a law giving effect to Article 39(b) or 39(c) from Articles 14 and 19. Kesavananda upheld that much. The 42nd Amendment tried to extend Article 31C to every directive principle. Minerva Mills struck that extension down. Fundamental duties, Article 51A, were added by the 42nd Amendment and expanded by the 86th. There are eleven clauses, (a) to (k). They are not enforceable by themselves. They are used to interpret rights and to uphold laws that promote them. Clause (k), the duty of a parent or guardian to educate a child between six and fourteen, is       idea: "India chose the Westminster model. The President is the formal head. The Council of Ministers, led by the Prime Minister, actually governs, and it stays in office while it has the confidence of the Lok Sabha.",

      story: "A bill passes both Houses and is presented to the President. Article 111 gives the President three choices: assent, withhold assent, or return a non-money Bill for reconsideration. If Parliament passes it again, the President shall not withhold assent. That sequence is the whole of presidential power over ordinary law-making. It is not a veto that can kill a Bill forever.",
      wider: "The framers knew Westminster from British India and from the 1935 Act, and they rejected the American model in which the head of government is not responsible to the legislature. Shamsher Singh holds that the President and the Governor are constitutional heads and act on the aid and advice of the Council of Ministers, except where the Constitution expressly requires them to act in their discretion. Article 74, after the 42nd and 44th Amendments, makes the advice binding, and allows the President to return it once for reconsideration. Collective responsibility, Article 75(3), is to the Lok Sabha, not to both Houses and not to the President. Individual responsibility means a minister holds office during the pleasure of the President, which in practice is the Prime Minister’s wish, and must leave if he disagrees publicly with a Cabinet decision he is not prepared to defend. Privileges of Parliament under Article 105 are the rights the House needs to function, including freedom of speech in the House. In re Keshav Singh, the President’s reference under Article 143, holds that privileges are subject to fundamental rights where the two collide outside the essential working of the House, and that a court can examine whether a claimed privilege exists. The anti-defection law is the Tenth Schedule, added by the 52nd Amendment. A member who voluntarily gives up the party, or who votes or abstains against the party whip, is disqualified, unless the Speaker’s decision is reviewed by the court, which Kihoto Hollohan allows on limited grounds. The Speaker decides first. The law limits the freedom to dissent in order to stop governments being bought. That is a real trade, and an answer should say so. The Attorney General, Article 76, is the first law officer, appointed by the President, entitled to audience in all courts, and entitled to take part in Parliament without a vote. Elections are Article 324. The Election Commission superintends, directs and controls elections. Mohinder Singh Gill treats Article 324 as a reservoir of power to secure a free and fair election where a statute is silent. Anoop Baranwal (2023) held that, until Parliament made a law, the Chief Election Commissioner and Election Commissioners should be selected by a committee of the Prime Minister, the Leader of the Opposition, and the Chief Justice of India. Parliament then passed the Chief Election Commissioner and other Election Commissioners (Appointment, Conditions of Service and Term of Office) Act, 2023. Under that Act the committee is the Prime Minister, the Leader of the Opposition, and a Union Cabinet Minister nominated by the Prime Minister. The Act is in force. A challenge to it was still not finally decided in September 2026, when a Bench differed on whether a Constitution Bench must hear it. Do not write that the Chief Justice is on the present statutory committee. Do not write that the Act has been struck down.",

      idea: "India is a Union of States with a federal division of powers and a Centre strong enough to hold the Union together. The Constitution does not use the word federation as its own label.",
      analogy: "A federation is a house with two kitchens and a written list of who may cook what. The Union List is the Centre’s kitchen. The State List is the State’s. The Concurrent List is the shared stove, and if both cook the same dish the Union recipe prevails, Article 254. In an emergency the Centre may walk into the State kitchen. That last sentence is why this federation is called one with a unitary bias.",
      story: "A State law on a subject in the Concurrent List conflicts with an existing parliamentary law. Article 254(1) says the parliamentary law wins. Article 254(2) allows the State law to prevail in that State if it was reserved for the President and received his assent, and Parliament can still legislate later and override it. That one article is Indian federalism in miniature: States have real lists, and the Centre has the last word when the lists collide.",
      wider: "Compare three models only as far as the question needs. The United States is a federation of enumerated federal powers, with the residue in the States, and a Senate of equal States. Canada, under the British North America Act, gave the residue to the Centre, which influenced the Indian drafting. India follows the Canadian residue: Article 248 and Entry 97 of the Union List give residuary power to Parliament. It follows the American written distribution and judicial review. Legislative relations are Articles 245 to 255. Administrative relations are Articles 256 to 263, including the power of the Union to give directions and the Inter-State Council. Financial relations are Articles 264 to 293, with the Finance Commission under Article 280 and the Goods and Services Tax Council under Article 279A. Disputes about inter-State rivers are Article 262, and Parliament may exclude the courts. Article 356 is the sharp end of the unitary bias. If the President, on a report of the Governor or otherwise, is satisfied that the government of a State cannot be carried on in accordance with the Constitution, he may assume the functions of the State government and declare that the powers of the Legislature shall be exercisable by Parliament. S.R. Bommai holds that the satisfaction is justiciable, that a floor test in the House is the way to test a majority, that secularism is part of the basic structure so a State government acting against it can be a constitutional failure, and that a dissolved Assembly can be revived if the proclamation was bad. The Sarkaria Commission, reporting in 1988, studied the same tension. It recommended that Article 356 be used as a last resort, that the Governor not act as an agent of the ruling party at the Centre, that the Inter-State Council be used, and that the States be consulted more often before their subjects are shifted. The Punchhi Commission, in 2010, returned to the same problems after the rise of coalition governments. One-party d, the extended Article 31C is void, and judicial review and the balance of Parts III and IV are part of the basic structure. Waman Rao and I.R. Coelho carry the same idea into the Ninth Schedule. After 24 April 1973, even a law parked in the Ninth Schedule can be examined for damage to the basic structure. The criticism of the doctrine is that the judges have the last word on what the foundation is, and the list is not closed. The defence is that without it Article 368 would let a temporary majority repeal the Constitution while claiming to amend it. Your unit asks you to understand that controversy, not to pretend the text contains the words basic structure.",

  c2u2: {

    detail: "Section 148 needs delivery and a purpose. Delivery may be actual or constructive. The bailor is the owner who delivers. The bailee is the person who receives. Section 151 imposes one standard of care: the care a prudent man would take of his own goods of the same bulk, quality and value. Section 152 says that if he takes that care, he is not liable for loss. India did not keep the old English degrees of care that varied with who benefited. Say Coggs v. Bernard only as history. The bailee must not make unauthorised use (section 154). If he does, he is liable even for accident. He must not mix the goods so that they cannot be separated (section 157). He must return them (sections 160 and 161). The bailor must disclose faults that he knows and that materially interfere with the use (section 150). A particular lien, section 170, is the right to retain the particular goods until the charges for labour or skill bestowed on them are paid. A general lien, section 171, is confined to bankers, factors, wharfingers, attorneys of a High Court, and policy-brokers, and it covers a general balance of account. Pledge is section 172. The pawnor is the debtor. The pawnee is the creditor in possession. The pawnee may retain the goods for the debt, interest, and necessary expenses (section 173). He may receive extraordinary expenses (section 175). If the pawnor defaults, the pawnee may sue on the debt and retain the goods as collateral, or sell after reasonable notice (section 176). He must account for the surplus. A pledge by a mercantile agent in possession, with the owner’s consent, can bind the owner if the pledgee acts in good faith (section 178).",

    detail: "Volenti non fit injuria is consent to the risk, not mere knowledge of it. The consent must be free. A workman who knows a machine is dangerous has not volunteered if he had no real choice. Necessity is a lesser harm done to avoid a greater one. It is not a right to destroy at leisure. Plaintiff’s own fault may reduce damages. In negligence it is now apportionment, not a complete bar. Act of God is a natural event so extraordinary that no human foresight could guard against it. Ordinary rain is not an act of God. Inevitable accident is a harm that reasonable care could not prevent, and it need not be natural. Private defence allows reasonable force while the danger lasts. Revenge after the danger has passed is a tort. Statutory authority is a defence only for the harm the statute authorises, and only if the act is done without negligence. Authority to build a railway is not authority to build it carelessly. A judge acting within jurisdiction is not liable for the decision. A person exercising a judicial function under a statute has a similar protection. A parent, or a person in a similar position, may use moderate force for correction. Cruelty is not correction.",
    chars: ["Volenti is consent, not knowledge.", "Act of God is extraordinary nature. Inevitable accident is unavoidable harm.", "Private defence must be proportionate and immediate.", "Statutory authority does not excuse negligence.", "Judicial immunity is for acts within jurisdiction.", "Parental correction has a ceiling of moderation."],
    settled: ["Knowledge of a risk is not volenti.", "Ordinary bad weather is not an act of God.", "A statute authorises the act, not a negligent way of doing it.", "Force used after the attack is over is not private defence."],
    cases: [
      { name: "Smith v. Baker (1891)", point: "A workman who knew of a crane swinging stones over his head had not consented to the risk. He had no real choice.", use: "volenti in employment." },
      { name: "Hall v. Brooklands Auto Racing Club (1933)", point: "A spectator of a dangerous sport consents to the ordinary risks of that sport, not to risks from a defective stand.", use: "volenti and its limit." },
      { name: "Nichols v. Marsland (1876)", point: "An extraordinary flood, beyond human foresight, was an act of God. Use it for the standard, and remember that ordinary rain will not do.", use: "act of God." },
      { name: "Vaughan v. Taff Vale Railway (1860)", point: "Where a statute authorises the running of locomotives, sparks caused without negligence are not a nuisance. Negligence would still be actionable.", use: "statutory authority." }
    ]
  },
  tu5: {
    ask: "Extinction of liability: death, waiver, release, accord and satisfaction, limitation.",
    open: "A tort claim can die with the person, be given up, be settled, or become too late. The old Latin maxim is no longer the whole answer.",
    detail: "Actio personalis moritur cum persona means a personal action dies with the person. Write it, and then write the exceptions, or you will lose the marks. Causes of action generally survive for and against the estate under the English Law Reform Act, 1934, which Indian answers use as the comparison. In India, a death caused by a wrongful act is carried by the Fatal Accidents Act, 1855, and, on the road, by the Motor Vehicles Act. Do not stop at the maxim. Waiver and acquiescence are conduct. He knew of the wrong and stood by, or chose another remedy, so that it is unfair to sue now. Release is an actual giving up. It is not inferred from silence. Accord and satisfaction is a substituted performance accepted in full settlement. Limitation is the Limitation Act, 1963. The period depends on the wrong. Libel and some other torts are shorter. Do not invent one period for every tort. If you do not remember the article in the Schedule, say that the period is the one in the Schedule for that tort, and do not guess a number.",
    chars: ["The maxim is the starting point, not the modern result.", "Death of the victim and death of the wrongdoer are both asked. Answer both.", "A statutory death claim is a new right in the dependants, not the dead man’s pain continued.", "Release must be real.", "Limitation is statutory and specific to the tort."],
    settled: ["Do not write that every tort dies with the person.", "A settlement accepted in full satisfaction ends the claim.", "Do not state a single limitation period for all torts."],
    cases: [
      { name: "Fatal Accidents Act, 1855", point: "Dependants may claim for the pecuniary loss caused by a death resulting from a wrongful act. It is the Indian statutory exception to the maxim.", use: "death of the injured person." },
      { name: "Law Reform (Miscellaneous Provisions) Act, 1934", point: "The English statute by which causes of action survive for and against the estate. Cite it as comparison, not as an Indian section.", use: "survival of the cause of action." }
    ]
  },
  tu6: {
    ask: "Who may sue, and who may be sued. Class actions. Capacity of a minor and a person of unsound mind.",
    open: "The person whose right was invaded sues. A stranger does not. A minor and a person of unsound mind can be liable for a tort. Their contract incapacity does not excuse a battery.",
    detail: "Standing follows the duty. If the duty was not owed to this plaintiff, he has no action, however sorry the facts. A class action under Order I Rule 8 of the Code of Civil Procedure lets one person, with the court’s permission, represent numerous persons with the same interest. It is procedure, not a new tort. A social or public-interest action is used where the people harmed cannot reach the court. It is not a private grudge in public dress. On the defendant’s side, a minor is liable for a tort. The court reaches him through a guardian. He is not liable if the tort is in truth a way of enforcing a void contract, as where the claim is really for the price of goods he was incompetent to buy. A person of unsound mind is generally liable, though intention may be missing in a tort that requires a specific intent. A corporation is liable for the torts of its servants. It has no body of its own. The State is dealt with in the next unit. Do not answer it here with a blanket immunity.",
    chars: ["The plaintiff must be the person to whom the duty was owed.", "Order I Rule 8 is representation, not a separate cause of action.", "Tortious capacity is wider than contractual capacity.", "A tort that is only a void contract in disguise does not bind a minor.", "A corporation acts through people and is liable for them."],
    settled: ["A minor can commit a tort.", "Contractual incapacity is not a general tort defence.", "A bystander who suffered no invasion of his own right cannot sue."],
    cases: [
      { name: "Order I Rule 8, Code of Civil Procedure", point: "One person may sue, with leave, for all persons who have the same interest. Notice to the class is part of the rule.", use: "class action. It is a procedural provision." }
    ]
  },
  tu7: {
    ask: "Vicarious liability of the State. Articles 294 and 300. Act of State. Sovereign immunity.",
    open: "The Union and the States may sue and be sued. Article 300 is the section to open with. The old Crown immunity is not a general answer.",
    detail: "Article 294 continues the pre-Constitution liabilities. Article 300 says the Government of India and a State may sue and be sued in the like cases as the corresponding dominion or province might have sued or been sued. That sentence dragged the old distinction between sovereign and non-sovereign functions into independent India. Kasturi Lal treated a police officer’s negligent dealing with seized gold as a sovereign function and refused liability. Later cases have not let the State walk away from a servant’s tort by calling the department sovereign. Nilabati Behera awarded compensation for a custodial death as a public-law remedy under Articles 21 and 32, which is not the same as a private tort action, and it is the case to use for custody. In a tort answer, say that sovereign immunity is not a living excuse for a servant’s wrongful injury to a citizen, and that Kasturi Lal must be confined to its facts. Act of State is a different doctrine. It is an act against a foreign sovereign or an alien outside allegiance, not justiciable in the municipal court. It is not the label for a policeman’s act against a citizen. The Crown Proceedings Act, 1947, and the Federal Tort Claims Act are comparisons. They are not Indian sections.",
    chars: ["The State can be sued. Article 300.", "Sovereign and non-sovereign is an old and fading distinction.", "A citizen injured by a servant is not an act of State.", "Custodial harm has a public-law compensation route as well as a tort route.", "Foreign comparisons are illustrations, not the Indian rule."],
    settled: ["Do not begin with the King can do no wrong.", "Act of State is not a defence to a tort against a citizen inside India.", "Kasturi Lal is not a charter of immunity for every police act."],
    cases: [
      { name: "State of Rajasthan v. Vidyawati (1962)", point: "The State was liable for a government driver’s rash driving. The function was not a sovereign act that excused the tort.", use: "State liability for a servant’s driving." },
      { name: "Kasturi Lal v. State of U.P. (1965)", point: "The Court refused liability for gold seized by the police and then misappropriated, treating the function as sovereign. Later law has not extended this into a general immunity.", use: "the case to distinguish, not the case to stop at." },
      { name: "Nilabati Behera v. State of Orissa (1993)", point: "Compensation for a custodial death was awarded as a public-law remedy for the breach of Article 21. Sovereign immunity was rejected for that purpose.", use: "custodial death, and the limit of Kasturi Lal." }
    ]
  },
  tu8: {
    ask: "Vicarious liability. Course of employment. Servant and independent contractor. Borrowed servant.",
    open: "A master is liable for a tort committed by his servant in the course of employment. He is not, ordinarily, liable for the manner in which an independent contractor does the work.",
    detail: "The reason is not that the master authorised the tort. The reason is that he takes the benefit of the work and controls it. Control is the old test: the master tells the servant not only what to do but how to do it. An independent contractor chooses the how. Course of employment includes a wrongful way of doing the authorised job, and an unauthorised mode of an authorised act. It does not include a frolic of the servant’s own. A prohibition on the way the work is done does not always take the act outside the course. A prohibition on doing that kind of act at all may. A borrowed servant remains the general employer’s responsibility unless control of the manner of work has really passed. A hospital is liable for the negligence of a doctor it employs. The old idea that a skilled professional is never a servant is not a safe answer. A corporation is liable in the same way, because it acts only through people. Authorisation and ratification are easier. If the master ordered the tort, or adopted it, he is liable as if he did it. That is not the difficult case.",
    chars: ["Control distinguishes a servant from an independent contractor.", "The tort must be in the course of employment.", "A wrongful mode of an authorised act is inside the course.", "A frolic of his own is outside it.", "A prohibition on method does not always exonerate the master.", "The hirer of an independent contractor is not liable for collateral negligence."],
    settled: ["The master need not have been at fault himself.", "An independent contractor’s negligence in the manner of the work is his own, subject to the non-delegable exceptions.", "A hospital can be vicariously liable for its employed doctor."],
    cases: [
      { name: "Limpus v. London General Omnibus Co. (1862)", point: "A driver who raced another bus, against orders, was still in the course of employment. He was doing the authorised job in a forbidden way.", use: "prohibited mode." },
      { name: "Beard v. London General Omnibus Co. (1900)", point: "A conductor who drove the bus was outside the course. Driving was not his job at all.", use: "the contrast with Limpus." },
      { name: "Mersey Docks and Harbour Board v. Coggins and Griffith (1947)", point: "The general employer remained liable for a crane driver lent with a crane, because control of the manner of work had not passed.", use: "borrowed servant." },
      { name: "Cassidy v. Ministry of Health (1951)", point: "A hospital was liable for the negligence of doctors and nurses it employed. The skilled worker can still be a servant.", use: "hospital, or a professional employee." }
    ]
  },
  tu9: {
    ask: "Assault, battery, mayhem, false imprisonment, defamation, malicious prosecution, nervous shock, shortened expectation of life.",
    open: "Separate the interest invaded. Body, liberty, and reputation are different torts. Do not plead them as one wrong called harassment.",
    detail: "Battery is unlawful contact. Assault is the threat of immediate contact. Words can be an assault if they create an immediate apprehension, and they can also negate an apparent threat. Mayhem is an old word for a disabling injury. Plead it as battery. False imprisonment is a total restraint of liberty, without lawful authority, for any time. A partial obstruction of a path is not enough. Knowledge of the confinement at the moment is not essential if he was in fact confined. Defamation is a false statement that lowers him in the estimation of right-thinking people, or exposes him to hatred, contempt or ridicule. Libel is written, or in a permanent form, and is generally actionable without special damage. Slander is spoken, and generally needs special damage, with exceptions for imputation of a crime, a contagious disease, unfitness in office, or, in the case of a woman, unchastity. Truth, fair comment on a matter of public interest, and privilege are the defences. Absolute privilege covers statements in Parliament and in the course of judicial proceedings. Qualified privilege covers a statement made in discharge of a duty, lost if there is express malice. Malicious prosecution needs four elements: a prosecution by the defendant, termination in the plaintiff’s favour, absence of reasonable and probable cause, and malice. A failed case is not enough. Nervous shock is a recognised psychiatric injury caused by the defendant’s tort, to a person the law treats as close enough. Mere grief is not the claim. Shortened expectation of life is a head of damage, not a separate tort.",
    chars: ["Assault is apprehension. Battery is contact.", "False imprisonment must be total.", "Libel is permanent. Slander is transient.", "Privilege is a defence to defamation, not a defence to battery.", "Malicious prosecution has four elements. Missing one fails the tort.", "Nervous shock is psychiatric injury, not sorrow."],
    settled: ["Mayhem is not a living separate tort to plead.", "A partial blockage of a road is not false imprisonment.", "Truth is a complete defence to civil defamation.", "Want of reasonable and probable cause and malice are both required in malicious prosecution."],
    cases: [
      { name: "Bird v. Jones (1845)", point: "Blocking one way across a bridge, while other ways remained, was not false imprisonment. The restraint was not total.", use: "false imprisonment." },
      { name: "Meering v. Grahame-White Aviation (1919)", point: "A person can be imprisoned without knowing it at the time, if he was in fact confined.", use: "knowledge and confinement." },
      { name: "D.P. Choudhary v. Manjulata (1997)", point: "A false published imputation against a young woman was defamatory. Use an Indian illustration beside the English definition.", use: "defamation on Indian facts." },
      { name: "West Bengal State Electricity Board v. Dilip Kumar Ray (2007)", point: "The Supreme Court restated malicious prosecution: prosecution, favourable termination, no reasonable and probable cause, and malice.", use: "the four elements. This is the Indian statement." }
    ]
  },
  tu10: {
    ask: "Trespass to land, trespass to goods, conversion, injurious falsehood, passing off, and the defences.",
    open: "Name the interest first. Land, goods, and the get-up of a business are not the same action.",
    detail: "Trespass to land is a direct unlawful entry, or remaining, or placing something on land in another’s possession. It is actionable without proof of damage. A person who enters by authority and then abuses it may be treated as a trespasser from the start. That is trespass ab initio, and it is narrower than students think. It applies to an authority given by law, abused by a positive wrongful act. Mistake of boundary is not a defence. A licence is. Trespass to goods is a direct wrongful interference. Conversion is dealing with goods in a way inconsistent with the owner’s right, intending to exercise dominion. Using his car as your own, selling it, or refusing to return it can be conversion. Detinue was the older claim for detention. Plead conversion. Injurious falsehood is a false statement about his goods or business, made maliciously, and causing actual damage. It is not defamation of the person. Passing off is selling your goods so that buyers believe they are his. The classical trinity is goodwill, misrepresentation, and damage. The defences to land and goods are licence, necessity, a right of way or other legal authority, and, for goods, a superior right. A licence that is exceeded is not a defence to the excess.",
    chars: ["Trespass to land protects possession.", "It is actionable per se.", "Conversion is dominion, not a mere touch.", "Injurious falsehood needs malice and special damage.", "Passing off protects goodwill, not a reputation for virtue.", "An exceeded licence is a trespass as to the excess."],
    settled: ["Mistake is not a defence to trespass.", "Trespass ab initio does not apply to a licence given by the occupier. It applies to an authority given by law.", "Passing off does not require a registered trademark."],
    cases: [
      { name: "Six Carpenters’ Case (1610)", point: "Trespass ab initio requires an authority given by law and a positive abuse of it. A mere omission does not relate back.", use: "trespass ab initio. State the limit." },
      { name: "Reckitt and Colman v. Borden (1990)", point: "The Jif Lemon case states passing off: goodwill, a misrepresentation, and likelihood of damage.", use: "passing off. The get-up problem." }
    ]
  },
  tu11: {
    ask: "Negligence: duty, breach, damage, contributory negligence, res ipsa loquitur, professional liability.",
    open: "Negligence is a duty to take care, a breach of that duty, and damage that is not too remote. All three. A careless act that hurts nobody is not this tort.",
    detail: "Duty is the neighbour principle. You must take reasonable care to avoid acts or omissions you can reasonably foresee would be likely to injure your neighbour, meaning a person so closely and directly affected that you ought to have him in contemplation. The standard is the reasonable person in that situation, not the defendant’s own best day. A professional is judged by the standard of an ordinary skilled person in that profession. Bolam said a doctor is not negligent if he acts in accordance with a practice accepted by a responsible body of medical men. Later English cases, and Indian consumer cases, have not treated every body of opinion as a shelter. The court can ask whether the practice has a logical basis. In an Indian answer, state Bolam and then the caution. Do not say the profession is the sole judge. Breach is falling below that standard. Damage needs factual causation and legal causation. The harm must be of a foreseeable kind. Contributory negligence is no longer a complete bar. The loss is apportioned according to fault. Res ipsa loquitur applies where the thing was under the defendant’s control, the accident is of a kind that does not happen without negligence, and there is no explanation. It calls for an explanation. It does not automatically decide the case if a real explanation is given.",
    chars: ["Duty, breach, and damage. Missing one fails the tort.", "The standard is objective.", "Foreseeability limits both duty and remoteness.", "Contributory negligence reduces damages. It does not usually defeat the claim.", "Res ipsa shifts the explanation, not the court’s final judgment in every case.", "A professional is judged by the skilled ordinary member of that profession."],
    settled: ["Donoghue states duty. It is not a case about consideration.", "The reasonable person is not the average of the defendant’s own habits.", "A failure to prove damage fails negligence, even if the driving was dreadful.", "Bolam is the starting point for doctors, not a conclusive immunity."],
    cases: [
      { name: "Donoghue v. Stevenson (1932)", point: "The manufacturer of a drink owed a duty to the ultimate consumer. The neighbour principle is the statement of duty.", use: "duty of care. Also product negligence." },
      { name: "Bolam v. Friern Hospital Management Committee (1957)", point: "A professional is not negligent if he follows a practice accepted as proper by a responsible body of skilled persons.", use: "medical or professional standard. Add the later caution." },
      { name: "Jacob Mathew v. State of Punjab (2005)", point: "The Supreme Court adopted a cautious Bolam approach for criminal and civil medical negligence, and warned against charging doctors on hindsight.", use: "the Indian medical-negligence question." },
      { name: "Municipal Corporation of Delhi v. Subhagwanti (1966)", point: "The collapse of a clock tower was fit for res ipsa loquitur. A structure under the corporation’s control does not fall if care is taken.", use: "res ipsa." }
    ]
  },
  tu12: {
    ask: "Rylands v. Fletcher and M.C. Mehta. Strict and absolute liability. The syllabus also names Bhopal, Machhu, Shriram and nuclear accidents.",
    open: "If something likely to do mischief escapes from land, start with Rylands. If the defendant is an enterprise in a hazardous industry, leave Rylands and apply M.C. Mehta.",
    detail: "Rylands v. Fletcher holds a person liable if he brings onto his land something likely to do mischief if it escapes, it escapes, and the use is non-natural. The liability is strict, not absolute. The defences are the plaintiff’s consent, the plaintiff’s own default, an act of a stranger, an act of God, and statutory authority. Non-natural use is a question of fact. Ordinary piping of water for domestic use has been treated as natural. A large reservoir was not. M.C. Mehta, arising from the oleum leak at Shriram, held that an enterprise engaged in a hazardous or inherently dangerous activity is absolutely liable for harm from an escape. The Rylands defences are not available. The measure of compensation must have a deterrent effect and correspond to the magnitude of the enterprise. Bhopal and the Machhu dam disaster are illustrations of scale. They did not create the rule. Do not cite the Bhopal settlement as the case that invented absolute liability. A road accident is not this tort. The Motor Vehicles Act has its own no-fault and fault structure. A railway claim may be statutory. Do not force a plant-leak doctrine onto a bus.",
    chars: ["Rylands needs an escape from land and a non-natural use.", "It is strict, and the named defences exist.", "M.C. Mehta is absolute. The enterprise, not a private reservoir, is the defendant.", "No Rylands defence is available under M.C. Mehta.", "The measure looks at the size of the enterprise.", "Statutory no-fault schemes are separate."],
    settled: ["M.C. Mehta does not overrule Rylands for a private non-natural use. It adds a stricter rule for hazardous industry.", "Act of a stranger is a Rylands defence. It is not an M.C. Mehta defence.", "Bhopal is not the ratio. M.C. Mehta is.", "A motor accident is a Motor Vehicles Act problem."],
    cases: [
      { name: "Rylands v. Fletcher (1868)", point: "The defendant who brings a dangerous thing onto his land and fails to keep it there is liable if it escapes, though he was not negligent. Defences remain.", use: "strict liability." },
      { name: "M.C. Mehta v. Union of India (1987)", point: "Absolute liability for a hazardous enterprise. No exceptions of the Rylands kind. Compensation correlated to the enterprise.", use: "oleum, Shriram, a chemical plant, a hazardous industry." },
      { name: "Union Carbide Corporation v. Union of India (1991)", point: "The Bhopal settlement case. Use it for the scale of an industrial disaster, not as the source of the absolute-liability rule.", use: "only if the question names Bhopal." }
    ]
  },
  tu13: {
    ask: "Nuisance. Private and public. Highway, pollution, noise, light and air.",
    open: "Nuisance is an unlawful interference with the use or enjoyment of land, or with a right of the public. Every annoyance is not a nuisance.",
    detail: "Private nuisance is a substantial and unreasonable interference with a person’s use or enjoyment of land, or with some right connected with it. Continuity and unreasonableness matter. A one-off escape may be Rylands or negligence rather than nuisance. The plaintiff must have an interest in the land. Public nuisance is a crime as well as a tort. It is an act which inflicts damage, inconvenience or injury on the public, or on a class of the public. A private person sues for a public nuisance only if he has suffered special damage, different in kind from the public’s. Obstruction of a highway is the syllabus example. If the whole town is inconvenienced and this plaintiff lost a particular day’s earnings because he could not pass, ask whether that is special damage. Pollution of air or water, and unreasonable noise, are private nuisance between neighbours and may also be a public nuisance. Interference with light and air is a nuisance only if the right exists. There is no natural right to an uninterrupted view, or to all the light one would like. A right to light is usually an easement. Coming to a nuisance is not, by itself, a defence. Statutory authority, if the nuisance is the inevitable result of the authorised act and there is no negligence, is a defence.",
    chars: ["Private nuisance protects use of land.", "The interference must be substantial and unreasonable.", "Public nuisance needs special damage for a private suit.", "A right to light is not automatic.", "Coming to the nuisance is not a defence.", "Malice can make an otherwise borderline interference unreasonable."],
    settled: ["A private person cannot sue for a public nuisance without special damage.", "Temporary building inconvenience is not automatically a nuisance.", "Sensitivity of the particular plaintiff does not raise the standard. The ordinary use of land is the measure."],
    cases: [
      { name: "St. Helen’s Smelting Co. v. Tipping (1865)", point: "Physical damage to property is a nuisance more readily than mere discomfort. Locality matters more for comfort than for material injury.", use: "smoke, fumes, the character of the neighbourhood." },
      { name: "Attorney General v. P.Y.A. Quarries (1957)", point: "A public nuisance is one which materially affects the reasonable comfort and convenience of a class of the public. It need not be the whole realm.", use: "public nuisance, dust and vibration." },
      { name: "Hollywood Silver Fox Farm v. Emmett (1936)", point: "Malicious firing of guns to disturb breeding foxes was a nuisance. Motive can matter where the interference is otherwise on the line.", use: "malice in nuisance. Contrast Bradford v. Pickles." }
    ]
  },
  tu14: {
    ask: "Remedies: damages, remoteness, injunction, restitution, and extra-judicial remedies including distress damage feasant.",
    open: "The ordinary remedy is damages. If money will not do, ask for an injunction. If the thing itself should come back, ask for restitution. Self-help is narrow.",
    detail: "Damages are compensatory. Special damages must be pleaded and proved. Nominal damages mark a right without substantial loss. Contemptuous damages mark a claim that should not have been brought. Punitive damages are exceptional. Remoteness in tort is reasonable foreseeability of the kind of damage. The old directness test is the contrast, not the living rule. The egg-shell skull rule sits beside it: if the kind of injury was foreseeable, the defendant takes the plaintiff as he finds him. An injunction is granted where damages will not do, and refused where the plaintiff stood by, or the harm is trivial, or an injunction would be oppressive out of all proportion. Restitution of property is the remedy where the goods or the land should come back. Extra-judicial remedies are peaceful re-entry, recaption of goods, abatement of nuisance, and distress damage feasant. Distress damage feasant is the old right to seize a straying animal or chattel that is doing damage on the land, and to retain it until compensation is paid. No breach of the peace. Proportion. These remedies are easy to get wrong in an answer. State the limit in the same sentence as the right.",
    chars: ["Compensation is the aim.", "The kind of damage must be foreseeable.", "The extent, in an egg-shell skull, need not be.", "An injunction is discretionary and forward-looking.", "Self-help ends where force or a breach of the peace begins.", "Distress damage feasant is seizure of the damaging thing, not a licence to punish the owner."],
    settled: ["Wagon Mound, not Re Polemis, is the remoteness test to apply.", "A trivial nuisance may get damages and no injunction.", "Abatement must be peaceable and, where it requires entry onto another’s land, is narrowly confined."],
    cases: [
      { name: "The Wagon Mound (No. 1) (1961)", point: "The defendant is liable for the kind of damage that was reasonably foreseeable. Directness is not the test.", use: "remoteness." },
      { name: "Re Polemis (1921)", point: "The old direct-consequence test. Cite it only as what Wagon Mound replaced.", use: "a comparison question." },
      { name: "Smith v. Leech Brain (1962)", point: "If a burn was foreseeable, the defendant was liable when the burn triggered cancer in a man with a pre-existing susceptibility.", use: "egg-shell skull." }
    ]
  },
  tu15: {
    ask: "Why tort litigation is slow. Procedure, evidence, experts, court fees. This is a policy question. Do not invent a new defence.",
    open: "The right can be clear and the suit still fail in practice. Delay, proof, and cost are the three practical bars.",
    detail: "The examiner is not asking for a new element of negligence. He is asking why a sound claim is hard to finish. A tort suit is an ordinary civil suit unless a statute gives a special forum. Pleadings, issues, witnesses, and appeals take years. Delay is not a defence. It is why limitation and interim injunctions matter. The plaintiff bears the burden of proving the tort, except where a presumption or res ipsa helps. Complicated rules of evidence are a reason claims fail, not a reason the duty does not exist. Expert evidence, including a laboratory report, can prove causation in a product or a medical case. It does not replace the legal elements. Court fees and the cost of lawyers are a practical bar. A right that costs too much to enforce is, for a poor plaintiff, a thin right. Legal aid, consumer fora, and motor-accident tribunals are part of the answer. They are not new torts. In a short note, write three paragraphs: delay, proof, and cost. End by saying that none of them is a defence on the merits.",
    chars: ["Delay is a fact of the process, not a legal excuse.", "The burden of proof remains on the plaintiff.", "Experts prove facts. They do not decide the duty.", "Cost can defeat a good claim.", "Special tribunals are a response to these bars."],
    settled: ["Do not treat delay as a new general defence.", "A consumer forum does not abolish the tort.", "Failure to prove causation fails the suit even if the sympathy is obvious."],
    cases: [
      { name: "Limitation Act, 1963", point: "Time is the legal face of delay. The period is the one in the Schedule for that tort.", use: "the only hard rule in an otherwise practical unit." }
    ]
  },
  tu16: {
    ask: "Consumer protection and tort. Manufacturers, professionals, caveat venditor, deceit, hazardous activity, product liability, common property.",
    open: "The common law and the Consumer Protection Act, 2019, both answer a defective product. Use the Act for the statutory claim, and Donoghue or M.C. Mehta where the question is still in tort.",
    detail: "A manufacturer owes a duty to the ultimate consumer. That is Donoghue, and it is the tort starting point. A doctor or a lawyer owes the duty of a skilled person in that calling. Caveat emptor is the old sale starting point, cut down by section 16 of the Sale of Goods Act. Caveat venditor, let the seller beware, is the direction of consumer law. Do not treat them as sections of the same Act. Deceit is a false statement made knowingly, without belief in its truth, or recklessly, intending that the plaintiff rely on it, and he does rely, and suffers damage. A false advertisement may be deceit and may also be an unfair trade practice. A plant leak is not a consumer-sale problem. It is M.C. Mehta. Product liability under Chapter VI of the Consumer Protection Act, 2019, makes a product manufacturer, a product seller, and a product service provider liable for harm from a defective product, on the grounds the chapter lists. Older notes mention EEC directives. Cite the 2019 Act in an Indian answer. A right of way over common property is a right to pass and repass, not a right to occupy the path. Obstruction is a public nuisance, and a private suit needs special damage. In a mixed question, separate the routes in the first paragraph: tort, sale, consumer statute, or public nuisance. Then apply one.",

  k1u1: {

  k1u7: {

  k1u8: {

  k2u1: {
    ask: "Parliamentary government. President, Council of Ministers, legislative process, privileges, anti-defection, Attorney General, elections.",
    open: "The Council of Ministers decides. It is collectively responsible to the Lok Sabha. The President is the seal, not a second government.",
    detail: "Article 74 requires a Council of Ministers with the Prime Minister at the head, to aid and advise the President. He may return advice once. After reconsideration, he acts on it. There is no general discretion clause of the kind Article 163 writes for a Governor. Article 75 is collective responsibility to the Lok Sabha. The Cabinet sinks together. Individual responsibility is a minister answering for his own department. The President is elected by an electoral college of elected MPs and elected MLAs, by proportional representation with the single transferable vote. Impeachment needs a two-thirds majority of the total membership of each House. A bill becomes law when both Houses agree and the President assents, except a money bill, which the Lok Sabha controls. Privileges under Article 105 have been claimed as supreme over fundamental rights, and fundamental rights have been claimed as supreme over privileges. In re under Article 143, the Court noticed the clash. Do not pretend it was never real. The Tenth Schedule disqualifies a member who votes against the whip or gives up the party, unless a merger has the support of two-thirds of the legislature party. The one-third split is gone. The Speaker decides. Kihoto allows limited judicial review. The Attorney General, Article 76, is the first law officer, holds office during the President’s pleasure, and is entitled to audience in all courts. He is not a member of the Cabinet by virtue of the office. Elections are superintended by the Election Commission under Article 324. Adult suffrage is Article 326, from the age of 18.",

    ask: "Federalism. Legislative, administrative and financial relations. Article 356. Jammu and Kashmir. Sarkaria.",
    open: "India is a Union of States with a strong Centre. The word federation is not in Article 1. The division of power, two levels of government, and a court are why the working is federal.",
    detail: "Legislative power is Article 246 and the Seventh Schedule. List I is Parliament. List II is the State, subject to Parliament’s power on the concurrent and union fields. List III is concurrent. A clash on the concurrent list is Article 254: the Union law prevails, and a later State law can be saved if it was reserved and received the President’s assent, subject to a later Union law. Residuary power is Parliament’s, Article 248. It is not with the States. Colourable legislation and pith and substance are the tools when a legislature dresses a law as one subject and really passes another. Administrative directions are Articles 256 and 257. The Centre may direct a State to comply with Union laws and not to impede Union executive power. Financial relations are Articles 268 to 281. The Finance Commission, Article 280, recommends the share. River disputes are Article 262. Parliament may exclude the jurisdiction of the courts. The Governor is appointed, holds office during pleasure, and has a written discretion. He is not a second President. Article 356 is a failure of constitutional machinery, not dislike of the party in office. Bommai requires a floor test where numbers are the issue, judicial review of the proclamation, and no dissolution of the Assembly before parliamentary approval. Sarkaria examined Centre-State relations and recommended restraint in using Article 356. It is a commission, not an article. Article 370 was a temporary provision in Part XXI. The 2019 change is a constitutional event. Do not describe the old article as if it still operates unchanged.",
    chars: ["Two governments, a written division, and a court.", "Residuary power is the Union’s.", "Article 254 is a concurrent clash, not a lack of competence.", "Article 356 is justiciable.", "The Governor’s discretion is real and narrow.", "Sarkaria is advice. Bommai is law."],
    settled: ["Do not give residuary power to the States.", "A law outside competence is void. It is not saved by Article 254.", "Article 356 does not take over the High Court.", "Do not answer a present Article 370 question as if 2019 had not happened."],
    cases: [
      { name: "S.R. Bommai v. Union of India (1994)", point: "Federalism is a basic feature. Article 356 is subject to judicial review. A floor test is the way to know the majority. The Assembly is not dissolved before Parliament approves.", use: "Article 356. This is the case." },
      { name: "State of West Bengal v. Union of India (1963)", point: "The Indian Constitution is not a compact of sovereign States. The Union is not a mere agent of the States.", use: "why India is not the American federation." },
      { name: "Atiabari Tea Co. v. State of Assam (1961)", point: "A tax that directly and immediately restricts trade can fail Article 301. Use it if the federalism question slides into trade.", use: "only if freedom of trade is asked inside this unit." }
    ]
  },
  k2u3: {
    ask: "Judicial review, the court system, appointment, subordinate courts, advisory jurisdiction, public-interest litigation, and judicial activism.",
    open: "Judicial review is the power to test a law or an act against the Constitution and refuse effect to what fails. Articles 32, 131, 136, 226 and 227 are different doors.",
    detail: "Name the door before the rhetoric. Article 32 is the Supreme Court, for fundamental rights. Article 226 is the High Court, for those rights and for other legal rights. Article 227 is superintendence over courts and tribunals. It is not a second appeal. Article 131 is an original suit between the Union and a State, or between States. Article 136 is special leave. It is discretionary and wide. Article 143 is advisory. The President may refer a question of law or fact of public importance. The Court need not answer a reference under Article 143(1). Appointment of judges is Articles 124 and 217, as read by the Court. The collegium is that reading of consultation. The National Judicial Appointments Commission amendment was struck down in 2015. Independence of the judiciary was treated as basic structure. Do not say the collegium is written as a word in Article 124. Subordinate courts are Articles 233 to 237. District judges are appointed by the Governor in consultation with the High Court. Control over the subordinate judiciary is with the High Court. Lokpal is not a court. It is the body under the Lokpal and Lokayuktas Act, 2013. A Lok Adalat is under the Legal Services Authorities Act, 1987. Public-interest litigation is a relaxation of standing, not a new article. It is for people who cannot reach the court. It is not a private grudge in public dress. Article 142 lets the Supreme Court pass a decree to do complete justice. It is not a power to amend the Constitution by order.",
    chars: ["Different articles, different jobs. Do not call all of them writs.", "Article 226 is wider than Article 32.", "Article 227 is superintendence, not a writ in disguise.", "The collegium is a judicial interpretation.", "PIL relaxes standing. It does not relax the Constitution.", "Article 142 operates inside the Constitution."],
    settled: ["The NJAC amendment did not survive.", "The Court need not answer an Article 143(1) reference.", "Lokpal is not a constitutional court.", "Judicial review of legislation cannot be excluded. L. Chandra Kumar."],
    cases: [
      { name: "L. Chandra Kumar v. Union of India (1997)", point: "Judicial review under Articles 32 and 226 is part of the basic structure.", use: "why a tribunal cannot be the last word." },
      { name: "Supreme Court Advocates-on-Record Association v. Union of India (2015)", point: "The NJAC amendment was struck down. Independence of the judiciary, and the Court’s role in appointment, were treated as basic.", use: "appointment of judges." },
      { name: "S.P. Gupta v. Union of India (1981)", point: "The earlier, more executive-friendly reading of consultation. Cite it as what the later collegium cases departed from, not as the living appointment rule.", use: "history of appointment." },
      { name: "Bandhua Mukti Morcha v. Union of India (1984)", point: "A letter from a person who was not the victim could start a proceeding for bonded labourers who could not reach the Court.", use: "public-interest litigation, and its proper use." }
    ]
  },
  k2u4: {
    ask: "The State executive and legislature. Governor, Council, Advocate General, money bill, ordinance, pardon.",
    open: "The Governor is appointed, holds office during the pleasure of the President, and is not impeached. He is a constitutional head with a written discretion. He is not a second President.",
    detail: "Compare him with the President in a table if the question allows it. The President is elected. The Governor is appointed. The President must act on reconsidered advice. The Governor has discretion where the Constitution requires him to act in his discretion, Article 163. Both have a Council of Ministers responsible to the popular House. The Advocate General, Article 165, is the State’s first law officer, appointed by the Governor. He is the counterpart of the Attorney General, not of the Chief Minister. The legislature is the Assembly, and a Council only where Article 169 has been used. A money bill is Article 199. It starts in the Assembly. The Council has fourteen days and no veto. An ordinance under Article 213 has the force of an Act and dies six weeks after the legislature reassembles, unless withdrawn or disapproved earlier. Pardon is the trap. Article 72 gives the President the power to pardon, and it extends to a sentence of death. Article 161 gives the Governor a power to suspend, remit or commute a sentence. He cannot pardon a death sentence. He may suspend, remit or commute it. Privileges of the State legislature follow Article 194. Disqualification of members includes the Tenth Schedule.",
    chars: ["Appointed, during pleasure, no impeachment.", "Discretion is written in Article 163. It is not a power to ignore a majority on the floor.", "Money bills start in the Assembly.", "An ordinance is temporary.", "Death: the President pardons. The Governor may suspend, remit or commute.", "The Advocate General is not a political minister."],
    settled: ["Do not give the Governor a power to pardon a death sentence.", "Do not give the Legislative Council a veto on a money bill.", "An ordinance is not a substitute for a session the government merely wishes to avoid. D.C. Wadhwa is the caution.", "Article 169, abolishing or creating a Council, is an ordinary law of Parliament on a State’s request. It is not an Article 368 amendment."],
    cases: [
      { name: "Samsher Singh v. State of Punjab (1974)", point: "The Governor is a formal head, except where the Constitution gives him a discretion.", use: "the ordinary case." },
      { name: "D.C. Wadhwa v. State of Bihar (1987)", point: "Re-promulgation of ordinances, as a method of running the State without the legislature, was struck down.", use: "ordinance." },
      { name: "S.R. Bommai v. Union of India (1994)", point: "A Governor’s report that a ministry has lost its majority is not the last word. The floor of the House is.", use: "discretion and Article 356." }
    ]
  },
  k2u5: {
    ask: "Panchayats, municipalities, co-operatives, tribal areas, finance, property, government contracts, and suits.",
    open: "Parts IX and IXA are elected local governments. They are not departments of the State. A government contract that is not in the form of Article 299 does not bind the Government.",
    detail: "Part IX, Articles 243 to 243-O, requires a three-tier panchayat except in small States, direct election, reservation, and a five-year term. An election is held within six months of dissolution, unless less than six months of the term remain. The Eleventh Schedule and Article 243G are a menu. The State endows the power. The Schedule does not transfer it by itself. Part IXA is the municipality: a nagar panchayat, a municipal council, or a municipal corporation. The Twelfth Schedule has eighteen subjects. Article 243W is the twin of 243G. Part IXB is co-operatives. The provisions that dictated the structure of State co-operative societies needed ratification and do not operate without it. Multi-State co-operatives remain. Rajendra N. Shah, 2021, is the case. Tribal areas are Article 244. The Fifth Schedule is scheduled areas generally. The Sixth is Assam, Meghalaya, Tripura and Mizoram, and their autonomous councils. Finance is the Consolidated Fund, the Finance Commission, and borrowing. A State borrows within India, and needs the Union’s consent if it already owes the Union. Property is Article 300A. A government contract must be expressed to be made by the President or the Governor, and executed by a person authorised in that behalf. Otherwise the Government is not bound. Article 300 lets the Government sue and be sued. Article 361 protects the President and Governors personally. It does not immunise the Government.",
    chars: ["Three local parts: IX, IXA, IXB. They are not interchangeable.", "The Schedules list subjects. The articles let the State endow them.", "Five years, and an election within six months.", "Article 299 is mandatory form.", "Article 300A is a law, not a fundamental right.", "Article 361 protects the person, not the Government."],
    settled: ["The Eleventh Schedule does not by itself transfer twenty-nine subjects.", "A contract not in the Article 299 form does not bind the Government.", "Part IXB’s directions to State co-operative societies did not all survive for want of ratification.", "Do not send an Article 300A claim to Article 32."],
    cases: [
      { name: "Rajendra N. Shah v. Union of India (2021)", point: "The parts of Part IXB that sought to dictate the composition and elections of State co-operative societies, without the required ratification, are inoperative.", use: "co-operatives." },
      { name: "Bhikraj Jaipuria v. Union of India (1962)", point: "Article 299 is mandatory. A contract that does not comply with it cannot be enforced against the Government.", use: "government contracts." }
    ]
  },
  k2u6: {
    ask: "Services. Pleasure, Article 311, Tulsiram Patel, all-India services, Public Service Commissions.",
    open: "A civil servant holds office during the pleasure of the President or the Governor. That pleasure is cut by Article 311.",
    detail: "Article 310 is the starting point. Article 311 is the cut. No person who is a member of a civil service, or who holds a civil post, shall be dismissed or removed by an authority subordinate to the authority that appointed him. No such person shall be dismissed, removed or reduced in rank except after an inquiry and a reasonable opportunity of being heard. The proviso to Article 311(2) is Tulsiram Patel. The inquiry may be dispensed with where he is convicted on a criminal charge, or where the authority is satisfied that it is not reasonably practicable to hold an inquiry and records its reasons, or where the President or the Governor is satisfied that in the interest of the security of the State it is not expedient to hold an inquiry. Dislike is not a fourth exception. All-India services are Article 312. The Rajya Sabha resolves, by two-thirds of the members present and voting, that it is necessary in the national interest, and Parliament then makes the law. Public Service Commissions are Articles 315 to 320. Consultation is required in the listed matters. Consultation is not, in every matter, a binding order. Removal of a member of a Commission is not pleasure. It is the misbehaviour procedure.",
    chars: ["Pleasure is the rule. Article 311 is the exception.", "The appointing authority, or a higher one, must dismiss.", "An inquiry and a hearing are the ordinary requirement.", "Three, and only three, ways to skip the inquiry.", "Security of the State is a satisfaction of the President or the Governor, not of a superintendent.", "Article 312 needs a Rajya Sabha resolution before the law."],
    settled: ["Tulsiram Patel upheld the proviso. It did not abolish the inquiry in ordinary cases.", "A reason that the inquiry is not practicable must be recorded.", "Article 311 does not apply to a military person in the same way. Read the opening words.", "Consultation with the Commission is not the same sentence as the pleasure doctrine."],
    cases: [
      { name: "Union of India v. Tulsiram Patel (1985)", point: "The second proviso to Article 311(2) is a complete code for the cases where the inquiry is dispensed with. Natural justice does not re-enter those cases by a side door. The conditions of the proviso must actually be met.", use: "any question that says he was dismissed without a hearing." }
    ]
  },
  k2u7: {
    ask: "Emergency. Articles 352, 356 and 360. Effect on rights and on the States.",
    open: "There are three alarms. They are not one proclamation. Name the article before you name the effect.",
    detail: "Article 352 is a proclamation of emergency on the ground of war, external aggression, or armed rebellion. Internal disturbance is the old, rejected ground. The President acts on written advice of the Cabinet. The proclamation must be approved by both Houses by the special majority used for an amendment, within one month. It lasts six months at a time. While it is in force, Article 353 lets the Centre give directions on any matter, and Parliament may legislate on the State List under Article 250. Article 358 suspends Article 19, and only in war or external aggression, not in armed rebellion. The law must recite the proclamation. Article 359 suspends the remedy of the rights the order names. Articles 20 and 21 cannot be suspended. That is the 44th Amendment, and it buried ADM Jabalpur. Article 356 is a failure of constitutional machinery in a State. Approval is by a simple majority, within two months. The High Court is not taken over. Bommai is the control. Article 360 is a financial emergency. It has never been used. Approval is by a simple majority. There is no written maximum duration. Salaries, including judges’ salaries, can be reduced. It does not suspend fundamental rights. A national emergency can be confined to a part of India. An extension of Article 356 beyond one year needs the conditions the article writes: an emergency in the whole of India or in the whole or part of that State, and an Election Commission certificate.",
    chars: ["352: security of India. Special majority. Six months.", "356: a State. Simple majority. Two months for the first approval.", "360: the treasury. Never used. Simple majority.", "358 is Article 19 stepping aside. 359 is the remedy of named rights.", "20 and 21 stay on.", "Armed rebellion is not internal disturbance."],
    settled: ["Do not give Article 356 a special majority, or Article 352 a simple majority.", "Article 358 does not apply to an armed-rebellion emergency.", "ADM Jabalpur is not the law on life.", "Article 360 does not suspend Part III."],
    cases: [
      { name: "S.R. Bommai v. Union of India (1994)", point: "Article 356 is justiciable. Floor test. No dissolution before approval. Federalism is basic.", use: "State emergency." },
      { name: "ADM Jabalpur v. Shivkant Shukla (1976)", point: "The Court refused habeas corpus even for life during the Emergency. The 44th Amendment, and later the Court, buried it. Cite it as a warning, not as law.", use: "suspension of Article 21. Then say it is dead." },
      { name: "Makhan Singh v. State of Punjab (1964)", point: "During the 1962 emergency the Court distinguished what Article 359 suspended. Use it for the older reading, and then come to the 44th Amendment.", use: "history of suspension." }
    ]
  },
  k2u8: {
    ask: "Amendment. Article 368, the basic structure, the 42nd and 44th Amendments, and the cases from Shankari Prasad to I.R. Coelho.",
    open: "Parliament may amend the Constitution, including fundamental rights. It may not destroy its basic structure. Amend does not mean destroy.",
    detail: "First separate the side doors. Articles 4 and 169 let some changes be made by ordinary law, and they say those changes are not amendments under Article 368. If the question is Article 368, the procedure is a bill in either House, passed by a majority of the total membership and by two-thirds of the members present and voting, in each House. There is no joint sitting. If the proviso list is touched, at least half the State legislatures must ratify. The early cases, Shankari Prasad and Sajjan Singh, held that an amendment is not law under Article 13, so fundamental rights could be amended. Golaknath, in 1967, treated an amendment as law and held that fundamental rights could not be amended. The 24th Amendment reversed that reading and wrote Article 13(4) and Article 368(3). Kesavananda, on 24 April 1973, is the settlement. Amendment includes fundamental rights. The power does not extend to destroying the basic structure. The list is not closed. Supremacy of the Constitution, republican and democratic form, secularism, separation of powers, federalism, judicial review, and the balance of Parts III and IV have all been treated as basic. The 42nd Amendment tried to widen the amending power and the emergency. The 44th restored the safeguards: written Cabinet advice, armed rebellion, and Articles 20 and 21 beyond suspension. Indira Gandhi v. Raj Narain treated free and fair elections, and judicial review of an election, as basic. I.R. Coelho holds that a law inserted in the Ninth Schedule after 24 April 1973 can still be tested on the basic structure. Waman Rao is the same date, used as the fence. A perfect vote can still fail.",
    chars: ["Two special-majority numbers, in each House, counted separately.", "No joint sitting.", "Ratification by half the States only for the proviso list.", "Basic structure is a judicial doctrine. It is not a schedule.", "24 April 1973 is the fence for the Ninth Schedule.", "The 42nd and the 44th are a swing and a correction."],
    settled: ["Do not say basic structure is written in Article 368.", "Do not say Parliament cannot amend fundamental rights. It can. It cannot abrogate the basic structure.", "Golaknath is not the law after the 24th Amendment and Kesavananda.", "A State boundary under Article 3 is not an Article 368 amendment."],
    cases: [
      { name: "Shankari Prasad (1951) and Sajjan Singh (1965)", point: "Amendments are not law under Article 13. Fundamental rights can be amended. The starting point, not the end.", use: "the early cases." },
      { name: "Golaknath v. State of Punjab (1967)", point: "Fundamental rights were put beyond amendment. The 24th Amendment undid this reading.", use: "the middle case. Do not apply it now." },
      { name: "Kesavananda Bharati (1973)", point: "The amending power is wide and limited. Basic structure cannot be destroyed.", use: "every amendment question. This is the case." },
      { name: "Indira Nehru Gandhi v. Raj Narain (1975)", point: "A clause that tried to put the Prime Minister’s election beyond judicial review damaged the basic structure.", use: "free and fair elections, judicial review." },
      { name: "Minerva Mills (1980)", point: "A limited amending power is itself part of the basic structure. Parliament cannot enlarge Article 368 so as to destroy that limit.", use: "the 42nd Amendment." },
      { name: "I.R. Coelho v. State of Tamil Nadu (2007)", point: "Ninth Schedule insertions after 24 April 1973 are open to basic-structure review.", use: "Article 31B." }
    ]
  }

<script src="llb-drill.js"></script>
<script src="llb-cases.js"></script>
<script>
const KEY = "llb-sem1-v1";
const done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
function save() { localStorage.setItem(KEY, JSON.stringify([...done])); }
if (!window.PAPERS) window.PAPERS = [];

let view = { paper: null, unit: null, q: "", map: false, jump: "", cases: false, cq: "" };
const briefs = t => (window.CaseBrief ? CaseBrief.under(t) : "");

function chartNode(n) {
  const cls = "node" + (n.to ? " go" : "");
  const inner = "<b>" + esc(n.t) + "</b><span>" + esc(n.s || "") + "</span>";
  if (n.to) return '<button type="button" class="' + cls + '" data-unit="' + esc(n.to) + '">' + inner + "</button>";
  return '<div class="' + cls + '">' + inner + "</div>";
}
function chartHtml(flow) {
  if (!flow || !flow.length) return "";
  return '<div class="chart">' + flow.map(item => {
    if (item.arrow) return '<div class="chart-arrow">' + esc(item.arrow) + "</div>";
    if (item.label) return '<div class="chart-title">' + esc(item.label) + "</div>";
    if (item.branch) {
      return '<div class="branch cols-' + (item.cols || 2) + '">' + item.branch.map(chartNode).join("") + "</div>";
    }
    return chartNode(item);
  }).join("") + "</div>";
}
function pointsHtml(u) {
  if (!u.points || !u.points.length) return "";
  return '<p class="grouplabel">Syllabus, lined up with the law</p>' +
    '<table class="align"><tr><th>No.</th><th>Concept</th><th>Section or article</th><th>The line to keep</th></tr>' +
    u.points.map((p, i) => '<tr id="pt-' + esc(u.id + "-" + i) + '"><td>' + esc(p.n) + "</td><td>" + esc(p.concept) + '</td><td class="law">' + esc(p.law) + "</td><td>" + esc(p.line) + "</td></tr>").join("") +
    "</table>";
}
function examHtml(id) {
  const e = (window.LLB_EXAM || {})[id];
  if (!e) return "";
  const lis = list => (list || []).map(x => "<li>" + esc(x) + "</li>").join("");
  const cases = (e.cases || []).map(c =>
    '<div class="card"><div class="term">' + esc(c.name) + '</div><div class="means">' + esc(c.point) + '</div>' +
    '<p class="lede" style="margin:8px 0 0"><b>Use it when: </b>' + esc(c.use) + "</p>" + briefs(c.name) + "</div>"
  ).join("");
  return '<div class="box gold"><h3>How the question is asked</h3><p style="margin:0">' + esc(e.ask) + "</p>" +
    (e.open ? '<p style="margin:8px 0 0"><b>Open with this: </b>' + esc(e.open) + "</p>" : "") + "</div>" +
    (e.detail ? '<div class="box"><h3>The explanation, in the order of an answer</h3><p style="margin:0">' + esc(e.detail) + "</p></div>" : "") +
    (e.chars ? '<p class="grouplabel">Characteristics. Write these, not a paragraph of synonyms.</p><ul class="cites">' + lis(e.chars) + "</ul>" : "") +
    (e.settled ? '<p class="grouplabel">Settled. Do not spend marks arguing these.</p><ul class="cites">' + lis(e.settled) + "</ul>" : "") +
    (cases ? '<p class="grouplabel">Cases. One holding, and the question it belongs to.</p>' + cases : "");
}

function drillHtml(id) {
  const d = (window.LLB_DRILL || {})[id];
  if (!d) return "";
  let html = "";
  if (d.memory) {
    html += '<div class="box gold"><h3>How to keep it</h3><p style="margin:0">' + esc(d.memory) + "</p>";
    if (d.pegs && d.pegs.length) {
      html += '<table class="align" style="margin-top:10px"><tr><th>Hook</th><th>Holds</th><th>The point</th></tr>' +
        d.pegs.map(p => '<tr><td><b>' + esc(p[0]) + '</b></td><td class="law">' + esc(p[1]) + "</td><td>" + esc(p[2]) + "</td></tr>").join("") +
        "</table>";
    }
    html += "</div>";
  }
  if (d.rows && d.rows.length) {
    html += '<p class="grouplabel">Bare Act drill. The operative words, then the characteristics, where they apply, and where they stop.</p>' +
      d.rows.map(r =>
        '<div class="card"><div class="term">' + esc(r.act) + " · " + esc(r.name) + "</div>" +
        '<p class="actwords">' + esc(r.words) + "</p>" +
        '<p class="drill-bit"><b>Characteristics. </b>' + esc(r.chars) + "</p>" +
        '<p class="drill-bit"><b>Applies. </b>' + esc(r.applies) + "</p>" +
        '<p class="drill-bit"><b>Stops. </b>' + esc(r.stops) + "</p></div>"
      ).join("");
  }
  return html;
}
function drillBlob(id) {
  const d = (window.LLB_DRILL || {})[id];
  if (!d) return "";
  return (d.memory || "") + " " + (d.rows || []).map(r => [r.act, r.name, r.words, r.chars, r.applies, r.stops].join(" ")).join(" ");
}
function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function flowNodes(list) {
  return list.map((s, i) =>
    (i ? '<div class="arrow"></div>' : "") +
    '<div class="node"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>'
  ).join("");
}
function renderHome() {
  const q = view.q.trim().toLowerCase();
  const cards = PAPERS.map(p => {
    const hits = q ? p.units.filter(u =>
      (u.title + " " + u.syllabus + " " + u.idea + " " + u.cards.map(c => c[0] + " " + c[1]).join(" ") + " " + (u.points || []).map(pt => pt.n + " " + pt.concept + " " + pt.law + " " + pt.line).join(" ") + " " + drillBlob(u.id)).toLowerCase().includes(q)
    ) : [];
    if (q && !hits.length && !(p.title + p.sub).toLowerCase().includes(q)) return "";
    const extra = hits.length ? '<span>Matches: ' + esc(hits.map(h => h.n + " " + h.title).join(" · ")) + '</span>' : '<span>' + esc(p.sub) + '</span>';
    return '<button class="paper-btn go" data-paper="' + p.id + '"><b>' + esc(p.title) + '</b>' + extra + '<span>' + p.units.length + ' units</span></button>';
  }).join("");
  document.getElementById("crumb").textContent = "First semester";
  document.getElementById("back").style.visibility = "hidden";
  document.getElementById("app").innerHTML =
    '<p class="kicker">LL.B. first semester</p>' +
    '<h1>One paper. Then one unit.</h1>' +
    '<p class="lede">Open Paper IV, Unit 1 first. The chart is the road from Company rule to the Constitution, and the hook under it is how you keep the dates. Every unit then gives the bare Act’s own words, the characteristics, where the rule applies, and where it stops. Your syllabus prints “Specific Relief Act, 1969”; the Act you cite is 1963. The Contract Act scan mis-spells many words. The lines on this page follow the Act.</p>' +
    '<input class="search" id="find" placeholder="Search a section, article, or word — 73, Article 21, Bommai, bailment" value="' + esc(view.q) + '">' +
    '<div class="papers" style="margin-top:14px">' + cards + '</div>' +
    '<div class="tabs"><button type="button" id="openMap">Syllabus map · every concept</button>' +
    (window.CaseBrief ? '<button type="button" id="openCases">Case book · ' + CaseBrief.count() + ' cases in full</button>' : '') + '</div>' +
    '<p class="lede" style="margin-top:18px">Constitutional Law is taught twice on purpose. This page follows the college unit order. <a class="quiet" href="constitution-learn.html">constitution-learn.html</a> teaches the same articles as rooms, with the longer explanations and the Part-by-Part walk.</p>';
  const find = document.getElementById("find");
  const openMap = document.getElementById("openMap");
  if (openMap) openMap.onclick = () => { view.map = true; show(); };
  const openCases = document.getElementById("openCases");
  if (openCases) openCases.onclick = () => { view.cases = true; show(); };
  find.addEventListener("input", () => { view.q = find.value; const pos = find.selectionStart; renderHome(); const n = document.getElementById("find"); n.focus(); n.setSelectionRange(pos, pos); });
}
function renderPaper(p) {
  document.getElementById("crumb").textContent = p.title;
  document.getElementById("back").style.visibility = "visible";
  document.getElementById("back").textContent = "All papers";
  const units = p.units.map((u, i) =>
    (i ? '<div class="arrow"></div>' : '') +
    '<button class="unit-btn go" data-unit="' + u.id + '"><b>' + esc(u.n) + " · " + esc(u.title) + '</b><span>' + esc(u.syllabus) + '</span></button>'
  ).join("");
  const diagram = p.diagram ? '<p class="grouplabel">Flow chart of the paper</p>' + chartHtml(p.diagram) + '<p class="lede">A red box opens that unit.</p>' : "";
  document.getElementById("app").innerHTML =
    '<p class="kicker">' + esc(p.title) + '</p><h1>' + esc(p.blurb) + '</h1>' +
    '<p class="lede">' + esc(p.how) + '</p>' + diagram +
    '<p class="grouplabel">Open a unit. The arrow is the order of the paper.</p><div class="flow">' + units + '</div>';
}
function renderSyllabusMap() {
  document.getElementById("crumb").textContent = "Syllabus map";
  document.getElementById("back").style.visibility = "visible";
  document.getElementById("back").textContent = "All papers";
  const body = PAPERS.map(p => {
    const units = p.units.map(u => {
      const rows = (u.points || []).map((pt, i) =>
        '<button type="button" class="unit-btn" data-jump="' + i + '" data-paper="' + p.id + '" data-unit="' + u.id + '"><b>' + esc(pt.n + " · " + pt.concept) + '</b><span>' + esc(pt.law) + " — " + esc(pt.line) + "</span></button>"
      ).join("");
      return '<p class="grouplabel">' + esc(u.n + " · " + u.title) + "</p>" + rows;
    }).join("");
    return '<h2>' + esc(p.title) + "</h2>" + units;
  }).join("");
  document.getElementById("app").innerHTML =
    '<p class="kicker">College syllabus, concept by concept</p><h1>Find the line. Then open the unit.</h1>' +
    '<p class="lede">Every numbered concept from the syllabus is here, with the section or article that carries it. Open one and the same line is highlighted in the unit.</p>' + body;
}
function renderCaseBook() {
  document.getElementById("crumb").textContent = "Case book";
  document.getElementById("back").style.visibility = "visible";
  document.getElementById("back").textContent = "All papers";
  document.getElementById("app").innerHTML =
    '<p class="kicker">Every case on this page, in full</p><h1>Who sued whom. What happened. Who won.</h1>' +
    '<p class="lede">Read the name and the hook. Before you open the case, say aloud: who sued, what happened, what the court held, and who won. Then open it and check. The hook is the picture to keep.</p>' +
    '<input class="search" id="findCase" placeholder="Search a party, year, or fact — snail, 1973, Pickles, minor" value="' + esc(view.cq) + '">' +
    '<div id="caseList">' + CaseBrief.book(view.cq) + "</div>";
  const f = document.getElementById("findCase");
  f.addEventListener("input", () => { view.cq = f.value; document.getElementById("caseList").innerHTML = CaseBrief.book(view.cq); });
}
function renderUnit(p, u) {
  document.getElementById("crumb").textContent = p.title;
  document.getElementById("back").style.visibility = "visible";
  document.getElementById("back").textContent = "Back to " + p.title;
  const steps = '<div class="flow">' + flowNodes(u.steps) + '</div>';
  let fork = "";
  if (u.fork) {
    const cols = u.fork.length === 2 ? "cols-2" : "cols-3";
    fork = '<p class="grouplabel">' + esc(u.forkLabel || "Split") + '</p><div class="branch ' + cols + '">' +
      u.fork.map(s => '<div class="node"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>').join("") + '</div>';
  }
  let table = "";
  if (u.table) {
    table = '<p class="grouplabel">' + esc(u.table.caption) + '</p><table><tr>' +
      u.table.heads.map(h => '<th>' + esc(h) + '</th>').join("") + '</tr>' +
      u.table.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") + '</table>';
  }
  const cards = u.cards.map((c, i) =>
    '<div class="card"><div class="term">' + esc(c[0]) + '</div><div class="means">' + esc(c[1]) + '</div>' +
    '<button type="button" class="reveal" data-ex="' + i + '">Show the example</button>' +
    '<div class="example" id="ex' + i + '">' + esc(c[2]) + '</div></div>'
  ).join("");
  const quiz = (u.quiz || []).map((q, qi) =>
    '<div class="q" data-qi="' + qi + '"><b>' + esc(q.q) + '</b><div class="opts">' +
    q.options.map((o, oi) => '<button type="button" data-qi="' + qi + '" data-oi="' + oi + '">' + esc(o) + '</button>').join("") +
    '</div><div class="why" id="why' + qi + '"></div></div>'
  ).join("");
  document.getElementById("app").innerHTML =
    '<p class="kicker">' + esc(u.n) + ' · ' + esc(u.syllabus) + '</p><h2>' + esc(u.title) + '</h2>' +
    '<div class="box gold"><h3>In one sentence</h3><p style="margin:0">' + esc(u.idea) + '</p></div>' +
    (u.flow ? '<p class="grouplabel">' + esc(u.flowTitle || "The order of the questions") + '</p>' + chartHtml(u.flow) : '') +
    drillHtml(u.id) +
    '<div class="box"><h3>Picture it this way</h3><p style="margin:0">' + esc(u.analogy) + '</p></div>' +
    '<div class="box"><h3>A situation</h3><p style="margin:0">' + esc(u.story) + '</p></div>' +
    pointsHtml(u) +
    '<p class="grouplabel">Follow the steps</p>' + steps + fork + table +
    examHtml(u.id) +
    (u.wider ? '<div class="box"><h3>Broader picture</h3><p style="margin:0">' + esc(u.wider) + '</p></div>' : '') +
    '<p class="grouplabel">Every point on this unit</p>' + cards +
    ((u.cites && u.cites.length) ? '<p class="grouplabel">Cite these</p><div class="box"><ul class="cites">' + u.cites.map(c => "<li>" + esc(c) + briefs(c) + "</li>").join("") + '</ul><p class="lede" style="margin:10px 0 0">In an answer, the section or article carries the rule. The case carries the point the court added. One accurate sentence is better than a wrong page number.</p></div>' : '') +
    (quiz ? '<p class="grouplabel">Say it back</p>' + quiz : '') +
    '<button type="button" class="know" id="know">' + (done.has(u.id) ? "Marked. You can explain this." : "I can explain this unit") + '</button>';
  if (view.jump) {
    const row = document.getElementById("pt-" + u.id + "-" + view.jump);
    if (row) {
      row.classList.add("here");
      row.scrollIntoView({ block: "center" });
    }
    view.jump = "";
  }
  document.getElementById("know").onclick = () => { done.add(u.id); save(); renderNav(); renderUnit(p, u); window.scrollTo(0, document.body.scrollHeight); };
}
function renderNav() {
  const side = document.getElementById("side");
  side.innerHTML = '<p class="kicker">Chapters</p>' + PAPERS.map(p => {
    const here = view.paper === p.id;
    const units = here ? p.units.map(u =>
      '<button type="button" class="nav-unit' + (view.unit === u.id ? " on" : "") + '" data-paper="' + p.id + '" data-unit="' + u.id + '">' +
      (done.has(u.id) ? '<span class="tick">● </span>' : "") + esc(u.n.replace("Unit ", "") + ". " + u.title) + "</button>"
    ).join("") : "";
    const label = p.title.replace(/^Paper\s+/, "");
    return '<button type="button" class="nav-paper' + (here ? " here" : "") + '" data-paper="' + p.id + '">' + esc(label) + "</button>" + units;
  }).join("");
  const current = side.querySelector(".nav-unit.on") || side.querySelector(".nav-paper.here");
  if (current) current.scrollIntoView({ block: "nearest" });
}
function show() {
  renderNav();
  if (view.cases && !view.paper && window.CaseBrief) return renderCaseBook();
  if (view.map && !view.paper) return renderSyllabusMap();
  if (!view.paper) return renderHome();
  const p = PAPERS.find(x => x.id === view.paper);
  if (!p) return renderHome();
  if (!view.unit) return renderPaper(p);
  const u = p.units.find(x => x.id === view.unit);
  if (!u) return renderPaper(p);
  const jumping = !!view.jump;
  renderUnit(p, u);
  if (!jumping) window.scrollTo(0, 0);
}
document.getElementById("navtoggle").onclick = () => document.querySelector(".shell").classList.toggle("nav-open");
document.getElementById("backdrop").onclick = () => document.querySelector(".shell").classList.remove("nav-open");
document.getElementById("side").onclick = (e) => {
  const hit = e.target.closest("[data-paper]");
  if (!hit) return;
  view.map = false;
  view.cases = false;
  view.paper = hit.dataset.paper;
  view.unit = hit.dataset.unit || null;
  document.querySelector(".shell").classList.remove("nav-open");
  show();
};
document.getElementById("back").onclick = () => {
  if (view.cases && !view.paper) { view.cases = false; show(); window.scrollTo(0, 0); return; }
  if (view.map && !view.unit) { view.map = false; show(); return; }
  if (view.unit) view.unit = null;
  else { view.paper = null; view.map = false; }
  show();
};
document.getElementById("app").onclick = (e) => {
  const jumped = e.target.closest("[data-jump]");
  if (jumped) {
    view.map = false;
    view.paper = jumped.dataset.paper;
    view.unit = jumped.dataset.unit;
    view.jump = jumped.dataset.jump;
    show();
    return;
  }
  const paper = e.target.closest("[data-paper]");
  if (paper && !paper.dataset.unit) {
    view.paper = paper.dataset.paper;
    view.unit = null;
    view.map = false;
    show();
    return;
  }
  const unit = e.target.closest("[data-unit]");
  if (unit) {
    if (!view.paper) {
      const owner = PAPERS.find(p => p.units.some(u => u.id === unit.dataset.unit));
      if (owner) view.paper = owner.id;
    }
    view.unit = unit.dataset.unit;
    view.map = false;
    show();
    return;
  }
  const rev = e.target.closest(".reveal");
  if (rev) { document.getElementById("ex" + rev.dataset.ex).classList.toggle("show"); return; }
  const opt = e.target.closest("[data-oi]");
  if (!opt) return;
  const p = PAPERS.find(x => x.id === view.paper);
  const u = p.units.find(x => x.id === view.unit);
  const q = u.quiz[Number(opt.dataset.qi)];
  const oi = Number(opt.dataset.oi);
  const box = opt.parentElement;
  [...box.children].forEach(b => { b.disabled = true; });
  opt.classList.add(oi === q.a ? "right" : "wrong");
  if (oi !== q.a) box.children[q.a].classList.add("right");
  document.getElementById("why" + opt.dataset.qi).textContent = q.why;
};
show();
</script>
